/* @@AK_SKIN@@ */

/* ============================================================
   ARKNIGHTS / PRTS TERMINAL SKIN
   依据 docs/arknights-style-prompts.md 重制：
   碳黑底 + 深灰面板 + 45° 斜切角 + 酸橙绿功能色 + 等宽数字
   ============================================================ */
:root{
  --ak-bg:#141516; --ak-bg-deep:#0d0e0f; --ak-panel:#1e1f21; --ak-panel-2:#232426;
  --ak-float:#3a3d40; --ak-line:#535353; --ak-line-soft:#2e3033;
  --ak-green:#b7e000; --ak-green-2:#a8e61d; --ak-amber:#f5d800; --ak-yellow:#ffee22;
  --ak-blue:#22bbff; --ak-red:#ff3030; --ak-orange:#ffab5b; --ak-act:#c14701;
  --ak-t1:#9aa4ad; --ak-t2:#5aa9e6; --ak-t3:#b07ad6; --ak-t4:#c9a227; --ak-t5:#e8722c; --ak-t6:#ff4d4d;
  --ak-mono:ui-monospace,"JetBrains Mono","Roboto Mono",Consolas,"SF Mono",Menlo,monospace;
  --ak-cn:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong",SimSun,serif;
  --ak-cn-sans:"Source Han Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --ch8:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  --ch10:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  --ch14:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  --ch18:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);
  /* 兼容旧变量：整体回到碳灰 + 酸橙绿体系 */
  --bg:#141516; --p:#1e1f21; --l:#535353; --g:#f5d800; --t:#ffffff; --m:#898989;
  --ok:#b7e000; --bad:#ff6060;
  --grid:linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/48px 48px,
         linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/48px 48px,
         linear-gradient(#ffffff05 1px,transparent 1px) 0 0/12px 12px,
         linear-gradient(90deg,#ffffff05 1px,transparent 1px) 0 0/12px 12px;
  --scan:repeating-linear-gradient(0deg,#0000 0 2px,#0000000f 2px 3px);
}
html,body{background:var(--ak-bg)}
body{
  font:14px/1.5 var(--ak-cn-sans);
  color:#fff;
  background:
    var(--scan),
    var(--grid),
    radial-gradient(120% 90% at 50% -12%,#2a2c2f 0,#191a1c 42%,#0f1011 100%) fixed;
  background-color:var(--ak-bg);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(115% 85% at 50% 45%,#0000 40%,#00000073 100%)}
#startScreen,#gameShell,#codexScene,#helpScene{position:relative;z-index:1}
::selection{background:var(--ak-green);color:#141516}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0f1011}
::-webkit-scrollbar-thumb{background:#3a3d40;border-left:1px solid var(--ak-line)}
::-webkit-scrollbar-thumb:hover{background:var(--ak-green)}
.cn-serif{font-family:var(--ak-cn);font-weight:700}
.mono{font-family:var(--ak-mono);font-variant-numeric:tabular-nums}

/* ---------- 抬头 / 状态条 ---------- */
header{position:relative;border-bottom:1px solid var(--ak-line);padding:14px 22px;margin-bottom:2px}
header::after{content:"";position:absolute;left:22px;bottom:-1px;width:150px;height:2px;background:var(--ak-green);box-shadow:0 0 10px #b7e00088}
header h1{
  font-family:var(--ak-cn);font-weight:700;font-size:26px;letter-spacing:.14em;color:#fff;
  padding-left:16px;border-left:5px solid var(--ak-green);line-height:1.15;
}
.sub{color:#898989;letter-spacing:.18em;font-size:11px;text-transform:uppercase;font-family:var(--ak-mono);margin-top:9px}
.stats{gap:8px}
.stat{
  position:relative;min-width:96px;padding:7px 12px 8px;background:linear-gradient(180deg,#232426,#1a1b1d);
  border:1px solid var(--ak-line-soft);clip-path:var(--ch8);
  font-family:var(--ak-cn);font-size:12px;letter-spacing:.2em;color:#aaa;
}
.stat::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:#3f4245}
.stat:nth-child(1)::before{background:var(--ak-red)}
.stat:nth-child(2)::before{background:var(--ak-amber)}
.stat:nth-child(3)::before{background:var(--ak-blue)}
.stat:nth-child(4)::before{background:var(--ak-green)}
.stat:nth-child(5)::before{background:var(--ak-orange)}
.stat b{
  display:block;margin-top:3px;color:#fff;font-family:var(--ak-mono);font-weight:700;
  font-size:24px;line-height:1.06;letter-spacing:0;
}
.stat:nth-child(1) b{color:#ff8189}
.stat:nth-child(2) b,.stat:nth-child(4) b{color:var(--ak-amber)}
.stat:nth-child(3) b{color:#7fd2ff}
.stat:nth-child(5) b{color:var(--ak-green)}

/* ---------- 面板：切角 + 四角准星 + 编号 ---------- */
.panel{
  position:relative;background:linear-gradient(160deg,#20212380,#18191be6);border:1px solid var(--ak-line-soft);
  clip-path:var(--ch14);padding:16px 18px 18px;margin-bottom:18px;backdrop-filter:blur(3px);
}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#b7e0002e,transparent 34%) top left/100% 1px no-repeat}
.panel::after{
  content:"";position:absolute;z-index:1;pointer-events:none;--cc:#535353;
  background:
    linear-gradient(var(--cc),var(--cc)) left top/11px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left top/1px 11px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right top/11px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right top/1px 11px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left bottom/11px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left bottom/1px 11px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right bottom/11px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right bottom/1px 11px no-repeat;
  top:6px;left:6px;right:6px;bottom:6px;
}
.panel>h2{
  font-family:var(--ak-cn);font-weight:700;font-size:17px;letter-spacing:.16em;color:#eaeaea;
  margin:0 0 14px;padding:0 0 8px 13px;border-bottom:1px solid var(--ak-line-soft);position:relative;
}
.panel>h2::before{content:"";position:absolute;left:0;top:3px;width:4px;height:14px;background:var(--ak-green);box-shadow:0 0 8px #b7e00099}
.enemy>h2::before{background:#ff6060;box-shadow:0 0 8px #ff606099}
.hint{color:#7c7f83;font-size:12px;letter-spacing:.05em;margin-top:10px;padding-left:12px;border-left:1px solid var(--ak-line-soft)}

/* ---------- 棋盘 ---------- */
.board{
  gap:7px;min-height:322px;padding:16px 14px;border:1px solid var(--ak-line-soft);border-radius:0;
  background:linear-gradient(#ffffff07 1px,transparent 1px) 0 0/26px 26px,
             linear-gradient(90deg,#ffffff07 1px,transparent 1px) 0 0/26px 26px,
             linear-gradient(180deg,#131415,#0e0f10);
  position:relative;
}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;border-top:2px solid #b7e00026}
section.panel.enemy .board{background:linear-gradient(#ff60600f 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,#ff60600f 1px,transparent 1px) 0 0/26px 26px,linear-gradient(180deg,#1a1315,#0f0d0e)}
.slot{
  border:1px solid #34383b;border-radius:0;background:linear-gradient(180deg,#1c1d1f,#161718);
  clip-path:var(--ch10);
}
/* 棋盘格：每格都是一个等宽方形，空格也占位，避免几条边框叠成一条缝 */
.board>.board-slot{flex:0 0 84px;width:84px;min-width:84px;min-height:244px}
.board>.board-slot.occupied:not(.battle){background:transparent;border-color:#232629;border-style:dashed}
.board-slot::after{width:12px;height:2px;background:#3a3d40}
.board-slot:not(.occupied):not(.battle)::before{color:#6b7075}
.board-slot:not(.occupied):not(.battle){
  background:
    repeating-linear-gradient(135deg,#ffffff05 0 4px,#0000 4px 9px),
    linear-gradient(180deg,#191a1c,#131415);
  border-style:dashed;border-color:#3d4247;
}
.board-slot:not(.occupied):not(.battle):hover{border-color:#b7e00099;background:#1d2410}
.slot::before{font-family:var(--ak-mono);font-size:11px;color:#5e6266;letter-spacing:0}
.slot::after{content:"";position:absolute;left:0;bottom:0;width:14px;height:2px;background:#3a3d40}
.slot.drop-target{border-color:var(--ak-green);background:#22300c;box-shadow:inset 0 0 0 1px #b7e00066}
.slot.drop-blocked{border-color:var(--ak-red);background:#2a1315;box-shadow:inset 0 0 0 1px #ff303055}
.enemy .slot{background:transparent;border-color:#26282a}
.shop.locked .slot{border-color:#f5d80088}
.shop.locked .slot::after{border-color:#f5d800;box-shadow:0 0 8px #f5d800}
.bench .slot::after,.shop .slot::after{width:100%;height:1px;background:linear-gradient(90deg,#ffffff12,#0000)}

/* ---------- 棋子卡：立绘卡面 ---------- */
.card{
  width:160px;min-height:244px;border:1px solid var(--c,#535353);border-radius:0;padding:0;gap:0;
  background:linear-gradient(180deg,#242527,#141516);box-shadow:0 6px 16px #000000a6;clip-path:var(--ch10);
  display:flex;flex-direction:column;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--c,#535353);z-index:6;opacity:.95}
.card:hover{filter:brightness(1.12) saturate(1.05);box-shadow:0 0 0 1px #ffffff26,0 10px 22px #000000b3}
.card.dragging{opacity:.5}
.card.attacking{z-index:5;filter:brightness(1.4)}
.card.dead{opacity:.26;filter:grayscale(1)}
.card.selected{outline:2px solid var(--ak-green)!important;outline-offset:2px;filter:brightness(1.14)}
.card.taunt{outline:2px solid var(--ak-blue);outline-offset:3px;box-shadow:0 0 18px #22bbff77,0 -7px 15px #ff3030bb,inset 0 10px 12px -10px #ff4b4be6;border-top-color:#ff4b4b}
/* 立绘 */
.card .portrait{position:relative;flex:1 1 auto;min-height:92px;overflow:hidden;background:linear-gradient(180deg,#26282a,#101112)}
.card .portrait::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,#141516cc 0,transparent 24%,transparent 56%,#0d0e0fe6 100%),
             radial-gradient(120% 70% at 50% 6%,transparent 46%,#101112b3 100%);
}
.card .portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:saturate(.94) contrast(1.05)}
.card.unaffordable .portrait img{filter:grayscale(.85) brightness(.6)}
.card .faction{
  position:absolute;z-index:3;top:6px;left:6px;padding:1px 5px;font-family:var(--ak-cn);font-size:10px;
  letter-spacing:.1em;color:#e6e6e6;background:#101112d9;border:1px solid var(--faction-c,#9aa4ad);border-left-width:3px;box-shadow:0 0 5px var(--faction-c,#9aa4ad),inset 0 0 3px var(--faction-c,#9aa4ad);
}
/* 职务默认不入卡面（详情弹窗里有），避免与阵营标签抢位置 */
.card .role{display:none}
/* 稀有度六边形星级标 */
.card .tier-mark{
  position:absolute;z-index:3;top:5px;right:5px;width:19px;height:21px;display:flex;align-items:center;justify-content:center;
  font-family:var(--ak-mono);font-weight:700;font-size:11px;color:#111;background:var(--c,#9aa4ad);
  clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%);
  box-shadow:0 0 8px #000000a6;
}
/* 四角准星 */
.card::after{
  content:"";position:absolute;z-index:5;pointer-events:none;--cc:#ffffff8c;
  background:
    linear-gradient(var(--cc),var(--cc)) left top/9px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left top/1px 9px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right top/9px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right top/1px 9px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left bottom/9px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left bottom/1px 9px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right bottom/9px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right bottom/1px 9px no-repeat;
  top:5px;left:5px;right:5px;bottom:5px;
}
.card.unit-card::after{--cc:#b7e000c9}
.card.enemy-card::after{--cc:#ff6060c9}
.card.golden::after,.card.golden-skill::after{--cc:#f5d800e6}
.card .stats{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:5px 8px;background:#101112e6;border-top:1px solid #ffffff1f;border-bottom:1px solid #00000080;
  font-family:var(--ak-mono);font-size:11px;letter-spacing:.02em;color:#c9cdd1;
}
.card .stats .atk b{color:var(--ak-yellow);font-weight:700}
.card .stats .hpv b{color:var(--ak-green);font-weight:700}
.card .stats .tier{font-family:var(--ak-cn);letter-spacing:.12em;color:#9aa0a6;font-size:10px}
.card .nameplate{
  position:relative;z-index:3;flex:0 0 auto;background:linear-gradient(180deg,#1b1c1e,#131415);
  padding:5px 8px 6px;border-top:1px solid #ffffff0f;
}
.card .name{
  display:block;min-height:0;font-family:var(--ak-cn);font-weight:700;font-size:15px;line-height:1.22;
  letter-spacing:.06em;text-align:left;color:#fdfdfd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px #000;
}
.card .hp{height:3px;margin-top:5px;background:#2a2c2f;border-radius:0}
.card .hp i{background:linear-gradient(90deg,#8fbf00,var(--ak-green))}
/* 技能卡：几何切分无立绘 */
.card.skill{
  background:linear-gradient(180deg,#242629,#15161a);border-color:#6d7787;
  background-image:linear-gradient(135deg,var(--c,#6d7787) -6px,transparent 64px),linear-gradient(180deg,#242629,#15161a);
}
.card.skill::before{background:var(--c,#6d7787)}
.card.skill .skilltop{
  position:relative;flex:1 1 auto;min-height:92px;display:flex;flex-direction:column;justify-content:flex-start;
  padding:9px 10px 8px;background:linear-gradient(#ffffff09 1px,transparent 1px) 0 0/100% 22px;
}
.card.skill .icon{
  display:block;white-space:nowrap;overflow:hidden;font-size:9.5px;font-family:var(--ak-cn);letter-spacing:.06em;
  color:#b9bdc1;border-bottom:1px solid #ffffff1f;padding-bottom:4px;
}
.card.skill .icon b{color:var(--ak-green);font-family:var(--ak-mono);font-weight:700;font-size:9px;letter-spacing:.08em}
.card.skill .name{font-size:15px;margin-top:7px;white-space:normal;overflow:hidden;line-height:1.2}
.card.skill .info{
  margin-top:7px;min-height:0;font-size:11px;line-height:1.45;color:#b6bcc2;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;
}
.card.skill .nameplate{text-align:center;border-top:1px solid #ffffff1f}
.card.skill .name{text-align:center;letter-spacing:.1em}
.card.golden,.card.golden-skill{
  --c:var(--ak-amber)!important;border-color:var(--ak-amber);
  background:linear-gradient(180deg,#3a3216,#1c1a12 58%,#15161a);
  box-shadow:0 0 16px #f5d80040;
}
.card.golden .portrait::after{background:linear-gradient(180deg,#f5d80026 0,transparent 30%,transparent 52%,#141208e6 100%)}
.card.golden .name,.card.golden-skill .name{color:#fff6c2;text-shadow:0 0 8px #f5d80070}
.card.golden .stats .atk b,.card.golden-skill .stats .atk b{color:#fff6c2}
.card .badges{right:7px;bottom:34px;z-index:6;gap:4px}
.badge.revive{width:18px;height:9px;border-width:2px;border-color:#ffe9a8;border-radius:99px}
.badge.legacy{width:14px;height:18px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#cbd4e2,#78828f);border-color:#e8eef7}

/* ---------- 按钮 ---------- */
.btn{
  position:relative;border:1px solid #5b6167;border-radius:0;background:linear-gradient(180deg,#33373a,#25282b);
  color:#e9ecef;padding:9px 16px;font-family:var(--ak-cn);font-weight:700;font-size:14px;letter-spacing:.12em;
  cursor:pointer;clip-path:var(--ch8);transition:filter .12s,background .12s,transform .08s;
}
.btn::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:#6f757a}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#d05303,#a63c01);border-color:#ff8b3d;color:#fff;box-shadow:0 0 14px #c1470166}
.btn.primary::before{background:#ffb066}
.btn.gold{background:linear-gradient(180deg,#5b4718,#3b2f10);border-color:#c9a227;color:#ffe9a8}
.btn.gold::before{background:var(--ak-amber)}
.btn.skip-ready{background:linear-gradient(180deg,#d05303,#a63c01);border-color:#ff8b3d;box-shadow:0 0 14px #c1470188}
.btn.secondary{background:linear-gradient(180deg,#2a2d30,#1e2023);border-color:#535353}
.btn.active,.view-controls .active,.codex-tabs .active,.codex-filters .active{
  background:linear-gradient(180deg,#1d5f80,#144763);border-color:var(--ak-blue);color:#eaf8ff;box-shadow:0 0 12px #22bbff55;
}
.btn.active::before,.view-controls .active::before,.codex-tabs .active::before,.codex-filters .active::before{background:var(--ak-blue)}
.btn:disabled{opacity:.4;filter:grayscale(.5)}
.controls{gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--ak-line-soft)}

/* ---------- 战报 ---------- */
.log{max-height:240px;color:#b9c0c6;font-family:var(--ak-mono);font-size:12.5px;line-height:1.6}
.log div{padding:5px 2px 5px 10px;border-bottom:1px solid #24262a;border-left:2px solid #3a3d40}
.log div.good{border-left-color:var(--ak-green);color:#cfe89a}
.log div.bad{border-left-color:var(--ak-red);color:#ffa8a8}
.good{color:var(--ak-green)}
.bad{color:#ff8080}
.keyword{border-radius:0;padding:0 2px}

/* ---------- 弹出详情 ---------- */
.detail-pop{
  border:1px solid var(--ak-line);border-radius:0;clip-path:var(--ch10);background:#111213f7;
  box-shadow:0 14px 40px #000000d9,inset 0 0 0 1px #ffffff0d;padding:16px 18px;font-size:15px;line-height:1.5;
}
.detail-pop::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--ak-green)}
.detail-pop.golden{border-color:var(--ak-amber);background:linear-gradient(180deg,#211c0d,#111213);box-shadow:0 0 24px #f5d8004d}
.detail-pop.golden::before{background:var(--ak-amber)}
.detail-pop h3{font-family:var(--ak-cn);font-weight:700;font-size:23px;letter-spacing:.1em;color:#fff;margin:0 0 6px}
.detail-pop .mechanic{border-top:1px solid var(--ak-line-soft);margin-top:9px;padding-top:9px}
.gold-toggle{
  margin-top:12px;border:1px solid var(--ak-amber);border-radius:0;clip-path:var(--ch8);
  background:linear-gradient(180deg,#4a3a12,#2c220f);color:#ffe08a;padding:6px 14px;letter-spacing:.14em;
  font-family:var(--ak-cn);font-weight:700;cursor:pointer;
}
.discover-pop{background:#0b0c0ddd;backdrop-filter:blur(4px)}
.discover-box{
  border:1px solid var(--ak-line);border-radius:0;clip-path:var(--ch14);background:linear-gradient(160deg,#202123,#141516);
  padding:20px 22px;box-shadow:0 18px 50px #000000d9;
}
.discover-box h3{font-family:var(--ak-cn);font-weight:700;letter-spacing:.12em;font-size:18px;margin:0 0 14px;color:#fff;padding-left:12px;border-left:4px solid var(--ak-green)}
.discover-option:hover{filter:brightness(1.18);transform:translateY(-2px)}

/* ---------- 开场 ---------- */
#startScreen{background:radial-gradient(120% 90% at 50% 0,#2a2c2f 0,#161718 46%,#0c0d0e 100%)}
.start-box{
  position:relative;width:min(760px,92vw);padding:56px 44px;border:1px solid var(--ak-line);border-radius:0;
  clip-path:var(--ch18);background:linear-gradient(160deg,#202123d9,#131415e6);box-shadow:0 26px 70px #000000b3;
}
.start-box::before{
  content:"";position:absolute;inset:0;pointer-events:none;--cc:#535353;
  background:
    linear-gradient(var(--cc),var(--cc)) left top/24px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left top/1px 24px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right top/24px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right top/1px 24px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left bottom/24px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) left bottom/1px 24px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right bottom/24px 1px no-repeat,
    linear-gradient(var(--cc),var(--cc)) right bottom/1px 24px no-repeat;
  top:12px;left:12px;right:12px;bottom:12px;
}
.start-box h1{
  font-size:clamp(30px,5vw,50px);letter-spacing:.22em;border-left:0;padding:0;line-height:1.1;
  font-family:var(--ak-cn);font-weight:700;color:#fff;
}
.start-box h1::after{
  content:"RHODES ISLAND // TAVERN AUTO CHESS";display:block;margin:14px 0 0;font-family:var(--ak-mono);
  font-size:11px;font-weight:400;letter-spacing:.34em;color:var(--ak-green);
}
.start-box .btn{font-size:18px;padding:13px 34px}
.start-actions{gap:12px}
.start-actions .secondary{background:linear-gradient(180deg,#2a2d30,#1d1f22);border:1px solid #535353}

/* ---------- 图鉴 / 说明 ---------- */
.codex-scene{background:radial-gradient(120% 90% at 50% -10%,#292b2e 0,#171819 48%,#0e0f10 100%)}
.codex-head{background:#101112e0;border-bottom:1px solid var(--ak-line);backdrop-filter:blur(12px)}
.codex-head h1{font-size:24px;letter-spacing:.18em;border-left:5px solid var(--ak-green);padding-left:14px}
.codex-item{
  position:relative;border:1px solid var(--ak-line-soft);border-radius:0;clip-path:var(--ch10);
  background:linear-gradient(180deg,#1c1d1f,#131415);padding:10px;
}
.codex-item:hover{border-color:var(--ak-green);background:linear-gradient(180deg,#21241c,#141516)}
.codex-grid{gap:14px}
.guide-card{
  border:1px solid var(--ak-line-soft);border-radius:0;clip-path:var(--ch14);
  background:linear-gradient(160deg,#1e2022,#141516);box-shadow:none;position:relative;
}
.guide-card::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:#3f4245}
.guide-card h2{color:#fff;border-bottom:1px solid var(--ak-line-soft);padding-bottom:8px;letter-spacing:.14em}
.guide-card h2::after{content:"";display:block;width:44px;height:2px;background:var(--ak-green);margin-top:8px}
.guide-card li{color:#c3c9ce;line-height:1.8}
.guide-card strong{color:var(--ak-yellow)}
.help-scene{background:radial-gradient(120% 90% at 20% 0,#2a2c2f 0,#171819 50%,#0e0f10 100%)}

/* ---------- 结算 ---------- */
.victory-overlay{background:radial-gradient(120% 90% at 50% 40%,#2b2e21 0,#111213 62%,#0a0b0c 100%)}
.victory-overlay.defeat{background:radial-gradient(120% 90% at 50% 40%,#33201f 0,#131112 62%,#0a0a0b 100%)}
.victory-title{
  font-family:var(--ak-mono);font-weight:700;letter-spacing:.08em;color:var(--ak-green);
  text-shadow:0 0 22px #b7e00070,0 0 60px #b7e00033;
}
.victory-overlay.defeat .victory-title{color:#ff6060;text-shadow:0 0 22px #ff303066,0 0 60px #ff001f33}
.victory-sub{font-family:var(--ak-cn);letter-spacing:.3em;color:#b9bdc1;font-size:20px}
.victory-unit{
  border:1px solid var(--ak-line-soft);border-radius:0;clip-path:var(--ch10);background:#191a1c;
  border-left:3px solid var(--ak-green);font-family:var(--ak-mono);color:#b9c0c6;
}
.victory-unit b{color:#fff;font-family:var(--ak-cn);letter-spacing:.1em}
.victory-score{font-family:var(--ak-mono);color:var(--ak-yellow);text-shadow:0 0 18px #ffee2255}
.scene-curtain{background:radial-gradient(circle,#e8ffb0 0 2%,#3a4a12 16%,#141516 68%)}

/* ---------- 移动端导航 ---------- */
.mobile-nav{
  border:1px solid var(--ak-line);border-radius:0;clip-path:var(--ch10);background:#101112ee;
  box-shadow:0 -6px 30px #000000b3;backdrop-filter:blur(12px);
}
.mobile-menu>button{color:#a3a8ad;font-family:var(--ak-cn);letter-spacing:.14em}
.mobile-menu.active>button{color:var(--ak-green)}
.mobile-submenu{border:1px solid var(--ak-line);border-radius:0;clip-path:var(--ch10);background:#1a1b1d;box-shadow:0 10px 30px #000c}
.mobile-submenu button{border:0;border-radius:0;background:#2b2e31;color:#eef1f4;font-family:var(--ak-cn);letter-spacing:.1em}
.mobile-submenu button:hover{background:#3a3d40}

/* ---------- 战斗特效 ---------- */
.cleave-slash{background:linear-gradient(90deg,#0000,#e8ffb0,#b7e000,#0000);box-shadow:0 0 12px #b7e000,0 0 22px #8fd000;border-radius:0}
.bullet{background:radial-gradient(circle,#fffde0 0,#f5d800 42%,#ff7a1c 72%,#0000 73%);box-shadow:0 0 10px #f5d800,0 0 18px #ff7a1c}

/* ---------- 窄屏适配 ---------- */
@media(max-width:900px){
  .card{width:132px;min-height:206px}
  .card .name{font-size:13px}
  .card .stats{font-size:10px;padding:4px 6px}

/* ================= 移动端强制横屏 =================
   触屏设备竖屏时不再重排竖屏布局，直接遮罩提示横置设备，横过来即进入游戏。
   条件里的 hover:none + pointer:coarse 用来把桌面鼠标环境排除在外：桌面即使把
   窗口拖成又窄又高的竖条形也不会命中，布局与交互完全保持原样。
   阈值 900px 覆盖手机竖屏（320-480）与小平板竖屏；设备转为横屏后 orientation
   变成 landscape，遮罩立即消失，布局回到原有的横屏分支。
   注：这里用 html::before 而非 body::before，因为 body::before 已被暗角装饰层占用。 */
@media (orientation:portrait) and (max-width:900px) and (hover:none) and (pointer:coarse){
html,body{overflow:hidden;height:100%}
html::before{
  content:"⟳\A 请将设备横置\A 以横屏进入游戏";
  white-space:pre-line;
  position:fixed;inset:0;z-index:60000;
  display:grid;place-content:center;
  text-align:center;
  padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  background:radial-gradient(circle at 50% 38%,#242c35,#0e1114 72%);
  color:#B7E000;
  font-family:var(--ak-cn,system-ui),"Microsoft YaHei",sans-serif;
  font-size:17px;font-weight:500;line-height:1.9;letter-spacing:.16em;
}
}

/* 触屏设备（无 hover）：hover 仅作装饰增强，去掉它避免悬停态粘在手指下；
   所有关键信息都有长按 / 点按入口，不依赖悬停展示。 */
@media (hover:none){
body.landscape .card:hover,body.portrait .card:hover{filter:none}
body.landscape .codex-item:hover,body.portrait .codex-item:hover{border-color:#344861;background:#172334}
body.landscape .discover-option:hover,body.portrait .discover-option:hover{filter:none;transform:none}
}
