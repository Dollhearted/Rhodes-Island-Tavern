#startScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}.start-box{padding:48px 64px;border:1px solid var(--l);border-radius:24px;background:#111c2bdd;box-shadow:0 20px 70px #0008}.start-box h1{font-size:52px;margin-bottom:28px}.start-box .btn{font-size:24px;padding:16px 42px}.hidden{display:none!important}.view-controls{display:flex;gap:8px;margin-top:10px}.view-controls .active{background:#3d8dc0;box-shadow:0 0 12px #5bc0ff88}body.landscape main{max-width:1880px;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px}body.landscape main .panel{margin:0;min-width:0}body.landscape main .panel:last-child{grid-column:1/-1}body.landscape header{max-width:1880px}body.landscape .board{min-height:250px;padding:12px;gap:5px;overflow-x:auto}body.landscape .board>.card{flex-basis:105px}body.landscape .card{width:105px;min-height:190px;padding:8px}body.landscape .name{font-size:16px;min-height:42px}body.landscape .info{font-size:12px;min-height:92px}body.landscape .insert-slot{flex-basis:16px!important;min-height:200px!important}body.landscape .bench,body.landscape .shop{grid-template-columns:repeat(6,minmax(100px,1fr))}body.landscape .bench .slot,body.landscape .shop .slot{min-height:208px}body.portrait main,body.portrait header{max-width:1000px}body.portrait main{display:block}body.landscape main .enemy{grid-column:1;grid-row:1}.landscape .board-panel{grid-column:1;grid-row:2}.landscape .shop-panel{grid-column:2;grid-row:1}.landscape .bench-panel{grid-column:2;grid-row:2}.landscape .log-panel{grid-column:1/-1;grid-row:3}.portrait .board{justify-content:center;overflow-x:auto}.collision-ghost{position:fixed!important;margin:0!important;z-index:30000!important;pointer-events:none!important;transition:none!important}.victory-overlay.defeat{background:radial-gradient(circle,#541f2b 0,#090e18 68%)}.victory-overlay.defeat .victory-title{color:#ff8192;text-shadow:0 0 20px #ff819288,0 0 60px #d72f4b88}.victory-overlay{position </style></head><body class="landscape"><div id="startScreen"><div class="start-box"><h1>♜ 酒馆自走棋</h1><button class="btn primary" id="startGame">开始游戏</button></div></div><div id="gameShell" class="hidden"><header><div><h1>♜ 酒馆自走棋</h1><div class="sub">单人 14 轮闯关 · 1×7 对战棋盘 · 12 格备战区</div><div class="view-controls"><button class="btn active" id="landscapeView">横屏</button><button class="btn" id="portraitView">竖屏</button></div></div><div class="stats"><div class="stat">生命<b id="hp">50</b></div><div class="stat">金币<b id="gold">3</b></div><div class="stat">下轮收入<b id="income">4</b></div><div class="stat">回合<b id="round">第 1/14 轮</b></div><div class="stat">阶段<b id="phase">备战 30s</b></div></div></header><main id="gameMain">
<section class="panel enemy"><h2>下一轮 AI 阵容预览（1 × 7）</h2><div class="board" id="enemy"></div><div class="hint">备战期间可查看下一轮敌方棋子；战斗将使用这批固定敌人。</div></section><section class="panel board-panel"><h2>我的棋盘（1 × 7）</h2><div class="board" id="board" ondragenter="allowBoardAreaSkillDrop(event)" ondragover="allowBoardAreaSkillDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropSkillToBoardArea(event)"></div><div class="hint">拖动备战区棋子到棋盘部署；将备战区或棋盘棋子拖入商店可出售（1 金币）。右键棋子可查看详细描述。</div></section><section class="panel bench-panel"><h2>备战区（12 张卡牌：棋子 + 技能）</h2><div class="bench" id="bench" ondragenter="allowBenchAreaDrop(event)" ondragover="allowBenchAreaDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropToBenchArea(event)"></div></section><section class="panel shop-panel"><h2>酒馆商店</h2><div class="shop" id="shop"></div><div class="controls"><button class="btn gold" id="refresh">刷新（1 金币）</button><button class="btn gold" id="upgrade">升级商店</button><button class="btn" id="lockShop">锁定商店</button><button class="btn primary" id="fight">结束备战</button><button class="btn" id="skip" style="display:none">跳过对战</button><button class="btn" id="sell">出售选中</button><button class="btn" id="reset">新游戏</button></div></section><section class="panel log-panel"><h2>战报</h2><div class="log" id="log"></div></section></main></div><div id="victoryOverlay" class="victory-overlay hidden"></div><script>

const playerId=localStorage.autochessPlayerId||(localStorage.autochessPlayerId='p-'+crypto.randomUUID());
const api=(url,body)=>fetch(url,body!==undefined?{method:'POST',headers:{'Content-Type':'application/json','X-Player-Id':playerId},body:JSON.stringify(body)}:{headers:{'X-Player-Id':playerId}}).then(async r=>{const txt=await r.text();let d;try{d=JSON.parse(txt)}catch{throw Error('接口返回异常：'+r.status+' '+txt.slice(0,40))}if(!r.ok)throw Error(d.error||'error');return d});
const PREP_TIMES=[30,30,30,45,45,60,60,90,90,90,90,90,90,90], UNIT_CARD_COST=3;
const s={gold:3,hp:50,round:1,board:Array(7).fill(null),enemy:Array(7).fill(null),bench:Array(12).fill(null),shop:[],cards:[],dragging:null,shopLevel:1,upgradeCost:5,nextIncome:4,shopSlots:4,busy:false,phase:'备战',prepSeconds:30,timer:null,shopLocked:false,skipBattleAvailable:false,skipBattle:false,assimilatedSources:{},fertileSoilGrowth:0,pendingNextRoundGold:0,battleWagers:0,freeRefreshes:0,totalGoldEarned:3,started:false};
const $=x=>document.querySelector(x), sleep=ms=>new Promise(r=>setTimeout(r,ms));
// 点击部署：选中备战区棋子后，点击棋盘中的任意插槽即可上场。
s.selectedBench=null;
document.head.insertAdjacentHTML('beforeend','<style>.card.selected{outline:4px solid var(--g);outline-offset:4px;filter:brightness(1.18)}</style>');
document.addEventListener('click',event=>{
  const benchCard=event.target.closest('.card[data-side="bench"]');
  if(benchCard&&s.phase==='备战'&&!s.busy){
    const index=Number(benchCard.dataset.slot)-1,unit=s.bench[index];
    if(unit?.card_type==='unit'){
      event.preventDefault();event.stopImmediatePropagation();
      s.selectedBench=s.selectedBench===index?null:index;
      draw();
      if(s.selectedBench!==null)document.querySelector('.card[data-side="bench"][data-slot="'+(s.selectedBench+1)+'"]')?.classList.add('selected');
      return;
    }
  }
  const insert=event.target.closest('#board .insert-slot');
  if(!insert||s.phase!=='备战'||s.busy||s.selectedBench===null)return;
  const unit=s.bench[s.selectedBench];
  if(!unit||unit.card_type!=='unit')return;
  const team=compact(s.board);
  if(team.length>=7){log('棋盘已满，无法上场。','bad');return;}
  event.preventDefault();event.stopImmediatePropagation();
  const position=[...insert.parentElement.children].slice(0,[...insert.parentElement.children].indexOf(insert)).filter(el=>el.classList.contains('card')).length;
  s.bench[s.selectedBench]=null;team.splice(position,0,unit);s.board=pad(team);s.selectedBench=null;
  onDeploy(unit);tryCombineTriples();draw();
},true);
const log=(x,c='')=>$('#log').insertAdjacentHTML('afterbegin','<div class="'+c+'">'+x+'</div>');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const live=u=>u&&(u.current_hp!==undefined?u.current_hp:u.max_hp), compact=a=>a.filter(Boolean).slice(0,7), pad=a=>compact(a).concat(Array(7-compact(a).length).fill(null)), emptyBench=()=>s.bench.findIndex(x=>!x);
function syncPlayer(r){s.gold=r.gold;s.hp=r.health??r.hp??s.hp;s.round=r.round??s.round;s.shopLevel=r.shop_level??s.shopLevel;s.upgradeCost=r.upgrade_cost??s.upgradeCost;s.nextIncome=r.next_income??r.income??s.nextIncome;s.shopSlots=r.shop_slots??s.shopSlots;s.totalGoldEarned=r.total_gold_earned??s.totalGoldEarned}
function bp(u){return Number(u?.bullet_strength||0)+Number(u?.bullet_strength_temp||0)+Number(u?.bullet_power||0)+Number(u?.ammo_strength||0)+Number(u?.ammo_power||0)}
function renderDesc(d){let out=esc(d||'');const kws={'横斩':'cleave','协同':'synergy','防御机制':'defense-mechanism','回营':'return-camp','兼并':'assimilate','挑选':'pick','售出':'sell','鸩毒':'venom','支援':'support','招募':'recruit','战意':'morale','先手':'initiative','突袭':'raid','复活':'revive','上场':'on-deploy','累计':'cumulative','永久':'permanent','战斗开始':'battle-start','嘲讽':'guard','护盾':'shield','守护':'guardian','后勤':'logistics','死仇':'death-feud','遗计':'legacy','铳弹伤害':'bullet-damage','铳弹强度':'bullet-strength'};for(const [k,c] of Object.entries(kws))out=out.replaceAll(k,'<span class="keyword kw-'+c+'">'+k+'</span>');return out}
function mechanicDetails(u){const m=new Set(u.mechanics||[]),rows=[];if(m.has('guard')||u.guard||/嘲讽/.test(u.description||''))rows.push(['kw-guard','嘲讽','此棋子会优先被选为攻击目标。']);if(m.has('on_deploy')||u.on_deploy)rows.push(['kw-on-deploy','上场','棋子放上棋盘时，触发效果。']);if(m.has('legacy')||u.legacy)rows.push(['kw-legacy','遗计','战斗阶段棋子阵亡时触发效果。']);if(m.has('bullet_damage')||/铳弹伤害/.test(u.description||''))rows.push(['kw-bullet-damage','铳弹伤害','触发时不碰撞，改为远程攻击；对敌方造成的伤害为基础数值 + 自身铳弹强度，对友方造成的伤害仅使用基础数值。']);if(m.has('revive')||u.revive)rows.push(['kw-revive','复活','战斗阶段阵亡后召唤一个不带复活效果的初始属性原棋子。']);if(m.has('initiative')||u.initiative)rows.push(['kw-initiative','先手','每回合战斗开始后进入先手阶段，双方棋子从左到右轮流结算先手与突袭。']);if(m.has('raid')||u.raid)rows.push(['kw-raid','突袭','突袭(X)：先手阶段或战斗中被召唤时立刻攻击X次；无法触发连击，且无法攻击潜伏的部将。突袭不受锡人效果影响。']);if(m.has('shield')||u.shield)rows.push(['kw-shield','护盾','免疫一次伤害，唯一效果不可叠加。']);if(m.has('guardian')||u.guardian)rows.push(['kw-guardian','守护','此棋子每次被攻击前，触发效果。']);if(m.has('cleave')||u.cleave)rows.push(['kw-cleave','横斩','对目标及相邻两个棋子造成同等攻击力伤害。']);if(m.has('synergy')||u.synergy){const x=(u.synergy||{}).faction||'X';rows.push(['kw-synergy','协同('+x+')','上场指定阵营（'+x+'）的棋子时触发效果；协同不是上场机制，不受可露希尔加成。'])}if(m.has('return_camp')||u.return_camp)rows.push(['kw-return-camp','回营','每回合备战阶段开始时，触发该效果。']);if(m.has('defense_mechanism')||u.defense_mechanism)rows.push(['kw-defense-mechanism','防御机制','嘲讽；护盾；锁血；潜伏；复活。']);if(m.has('assimilate')||u.assimilate)rows.push(['kw-assimilate','兼并','移除一个棋子并获得其属性。备战阶段被兼并的棋子永久移除；战斗阶段被兼并的棋子在战斗结束后返回队伍。妮芙仅在本场战斗中获得被兼并棋子的遗计，战斗结束后移除。被妮芙兼并的棋子会从靠近妮芙的一侧开始、由右向左依次结算遗计和复活，且无法获得同时被兼并棋子的遗计效果。']);if(m.has('sell')||u.sell)rows.push(['kw-sell','售出','出售该棋子时，触发效果。']);if(m.has('pick')||u.pick)rows.push(['kw-pick','挑选','3张牌中选取一张。']);if(m.has('venom')||u.venom)rows.push(['kw-venom','鸩毒','首次造成伤害后立刻消灭目标，唯一效果不可叠加。']);if(m.has('morale')||u.morale)rows.push(['kw-morale','战意','此棋子在己方场上时，每次属性提升，触发效果（战意效果无法相互触发）。']);if(m.has('support')||u.support)rows.push(['kw-support','支援','支援(X)：玩家使用X次技能卡时触发效果，默认为支援(1)；棋子释放技能 function hasMark(u,k){return !!(u&&(u[k]||(u.mechanics||[]).includes(k)))}

function counterInfo(u){if(u?.gold_spend){const th=Number(u.gold_spend.threshold||7),c=Number(u.gold_spent_count||0);return '<br><span class="keyword kw-cumulative">累计消费</span> '+c+'/'+th}const e=u?.cumulative_damage,has=!!(e||u?.id==='Enforcer'||u?.cumulative_damage_count!==undefined||u?.mostima_damage_count!==undefined);if(!has)return '';const key=(e||{}).counter_key||'cumulative_damage_count',th=Number((e||{}).threshold||3),c=Number(u[key]||0);return '<br><span class="keyword kw-cumulative">累计</span> '+c+'/'+th}
function badgeHtml(u){let b='';if(hasMark(u,'revive'))b+='<span class="badge revive" title="复活"></span>';if(hasMark(u,'legacy'))b+='<span class="badge legacy" title="遗计"></span>';if(hasMark(u,'venom'))b+='<span class="badge venom" title="鸩毒"></span>';return b?'<div class="badges">'+b+'</div>':''}
function card(u,w,i){if(!u)return '';const skill=u.card_type==='skill',hp=live(u),max=u.max_hp||1,can=s.phase==='备战'&&!s.busy&&((w==='bench'&&(u.card_type==='unit'||u.card_type==='skill'))||(w==='shop'&&u.card_type==='unit')||(w==='board'&&u.card_type==='unit'));const cls=['card',skill?'skill':'',u.golden?'golden':'',u.golden_skill?'golden-skill':'',hasMark(u,'guard')?'taunt':'',hasMark(u,'shield')?'shielded':'',hp<=0?'dead':''].filter(Boolean).join(' '),drag=can?' draggable="true" ondragstart="dragCard(event,\''+w+'\','+i+')" ondragend="dragEnd(event)"':'',drop=w==='board'&&!skill?' ondragenter="allowUnitSkillDrop(event,'+i+')" ondragover="allowUnitSkillDrop(event,'+i+')" ondragleave="leaveDrop(event)" ondrop="dropSkillToUnit(event,'+i+')"':'';const info=skill?renderDesc(u.description):('★'.repeat(Math.max(1,u.stars||1))+'　'+esc(u.faction||'无')+'　阶 '+(u.tier||1)+'<br>攻 '+u.attack+'　血 '+Math.max(0,hp)+'/'+max+bulletInfoHtml(u)+counterInfo(u));return '<div class="'+cls+'" style="--c:'+(u.color||'#e53935')+'" onclick="choose(\''+w+'\','+i+')" oncontextmenu="rightClickCard(event,\''+w+'\','+i+')" data-side="'+w+'" data-slot="'+(i+1)+'"'+drag+drop+'><div class="name">'+esc(u.name)+'</div><div class="info">'+info+'</div>'+(skill?'':'<div class="hp"><i style="width:'+Math.max(0,hp/max*100)+'%"></i></div>'+badgeHtml(u))+'</div>'}
const ins=pos=>'<div class="slot insert-slot" data-slot="+" ondragenter="allowBoardDrop(event,'+pos+')" ondragover="allowBoardDrop(event,'+pos+')" ondragleave="leaveDrop(event)" ondrop="dropToBoardInsert(event,'+pos+')"></div>';
function renderBoard(w){if(s.phase==='战斗中')return s[w].map((u,i)=>u?card(u,w,i):'').join('');if(w==='board'){const u=compact(s.board);return ins(0)+u.map((x,i)=>card(x,w,i)+ins(i+1)).join('')}if(w==='enemy')return compact(s.enemy).map((u,i)=>card(u,w,i)).join('');return s[w].map((u,i)=>u?card(u,w,i):'<div class="slot" data-slot="'+(i+1)+'"></div>').join('')}
function draw(){if(s.phase==='战斗中'){s.board=s.board.concat(Array(7).fill(null)).slice(0,7);s.enemy=s.enemy.concat(Array(7).fill(null)).slice(0,7)}else{s.board=pad(s.board);s.enemy=s.enemy.concat(Array(7).fill(null)).slice(0,7)}$('#enemy').innerHTML=renderBoard('enemy');$('#board').innerHTML=renderBoard('board');$('#bench').innerHTML=s.bench.map((u,i)=>'<div class="slot" data-slot="'+(i+1)+'" ondragenter="allowBenchDrop(event,'+i+')" ondragover="allowBenchDrop(event,'+i+')" ondragleave="leaveDrop(event)" ondrop="dropToBench(event,'+i+')">'+card(u,'bench',i)+'</div>').join('');while(s.shop.length<s.shopSlots)s.shop.push(null);$('#shop').innerHTML=s.shop.slice(0,s.shopSlots).map((u,i)=>'<div class="slot" data-slot="'+(i+1)+'" ondragenter="allowShopDrop(event)" ondragover="allowShopDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropToShop(event)">'+card(u,'shop',i)+'</div>').join('');$('#shop').classList.toggle('locked',s.shopLocked);$('#refresh').textContent=s.freeRefreshes>0?'刷新（免费 ×'+s.freeRefreshes+'）':'刷新（1 金币）';$('#gold').textContent=s.gold;$('#hp').textContent=s.hp;$('#income').textContent=s.nextIncome;$('#round').textContent='第 '+s.round+'/14 轮';$('#phase').textContent=s.phase==='备战'?'备战 '+Math.max(0,s.prepSeconds)+'s':s.phase;$('#upgrade').textContent=s.shopLevel>=6?'商店满级':'升级商店（'+s.upgradeCost+' 金币｜Lv.'+s.shopLevel+'）';$('#lockShop').textContent=s.shopLocked?'取消锁定':'锁定商店';$('#fight').style.display=s.phase==='备战'?'inline-block':'none';$('#fight').disabled=s.busy||s.phase!=='备战';const sk=$('#skip');sk.style.display=s.phase==='战斗中'?'inline-block':'none';sk.textContent='跳过对战';sk.disabled=s.phase==='战斗中'?!s.skipBattleAvailable:true;sk.classList.toggle('skip-ready',s.phase==='战斗中'&&s.skipBattleAvailable);$('#sell').disabled=true}

function triggerClientMorale(u,source=''){if(source==='morale'||!u?.morale)return;const e=u.morale||{},a=Number(e.attack||0),h=Number(e.max_hp||e.hp||0);let targets=[u];if(e.type==='random_other_buff'){const candidates=compact(s.board).filter(x=>x&&x!==u);if(!candidates.length)return;targets=[candidates[Math.floor(Math.random()*candidates.length)]]}else if(e.type==='team_hp_buff'||e.type==='team_attack_buff'||e.type==='team_buff')targets=compact(s.board);else if(e.type==='faction_team_buff')targets=compact(s.board).filter(x=>x.faction===e.faction||x.faction==='任意');for(const target of targets){const old=Number(target.max_hp||1);if(a)target.attack=Number(target.attack||0)+a;if(h){target.max_hp=old+h;target.current_hp=Number(target.current_hp??old)+h}}log(u.name+' 触发战意：'+targets.length+' 个友方获得永久增益。','good')}

function applyGoldenOverrides(u){if(!u)return u;const g=u.golden_overrides||{};Object.assign(u,structuredClone(g));if(u.golden_description)u.description=u.golden_description;u.golden=true;u.current_hp=u.max_hp;return u}
function baseUnitById(id){return s.cards.find(c=>c.card_type==='unit'&&c.id===id)}
function extraStatSum(copies,orig,key){return copies.reduce((n,c)=>n+Math.max(0,Number(c?.[key]||0)-Number(orig?.[key]||0)),0)}
function goldenCopy(base,copies=null){const orig=baseUnitById(base.id)||base;const u=structuredClone(orig);for(const k of ['current_hp','temporary_revive','revive_consumed_by_summon','summoned_by_phase','summoned_by_revival','summoned_by_legacy','bullet_strength_temp','death_feud_count'])delete u[k];applyGoldenOverrides(u);const cs=copies&&copies.length?copies:[base];u.attack=Number(orig.attack||0)*2+extraStatSum(cs,orig,'attack');u.max_hp=Number(orig.max_hp||1)*2+extraStatSum(cs,orig,'max_hp');u.current_hp=u.max_hp;u.bullet_strength=extraStatSum(cs,orig,'bullet_strength');u.bullet_damage=Number(u.bullet_damage||0)+extraStatSum(cs,orig,'bullet_damage');if(cs.some(c=>hasMark(c,'guard')))setGuard(u,true);return u}
function goldenRewardCard(){const x=Math.min(6,Number(s.shopLevel||1)+1);return {id:'triple_reward_'+Date.now()+'_'+Math.random().toString(36).slice(2),name:'紧急支援',card_type:'skill',faction:'金卡奖励',cost:x,effect_value:0,description:'拖至棋盘后，从三个互不相同的 '+x+' 星普通棋子中选择1个加入备战区。',color:'#ffd35a',effect:'discover_unit',discover_star:x,target_scope:'board',golden_skill:true,triple_reward_only:true,unit_id:null,stars:0}}

function showCardDetail(ev,w,i){ev.preventDefault();const u=(w==='discover'||w==='sale-pick'||w==='select-target')?document.querySelector('.discover-pop')?._options?.[i]:s[w]?.[i];if(!u)return;document.querySelector('.detail-pop')?.remove();const p=document.createElement('div');const gold=!!u.golden;p.className='detail-pop'+(gold?' golden':'');p._unit=u;p._gold=gold;p.innerHTML=detailInner(u,gold);document.body.appendChild(p);p.style.left=Math.max(8,Math.min(ev.clientX+12,innerWidth-p.offsetWidth-8))+'px';p.style.top=Math.max(8,Math.min(ev.clientY+12,innerHeight-p.offsetHeight-8))+'px'}

function transformUnitInto(source,target,asGolden=false){const keep={attack:Number(source.attack||0),max_hp:Number(source.max_hp||1),current_hp:Number(source.current_hp??source.max_hp??1),bullet_strength:Number(source.bullet_strength||0),bullet_damage:Number(source.bullet_damage||0)},ordinary=baseUnitById(target.id)||target;let t=structuredClone(ordinary);if(asGolden)t=goldenCopy(ordinary);for(const k of ['current_hp','temporary_revive','revive_consumed_by_summon','summoned_by_phase','summoned_by_revival','summoned_by_legacy','bullet_strength_temp','death_feud_count'])delete t[k];Object.assign(source,t,keep);source.golden=!!asGolden;source.current_hp=Math.min(source.current_hp,source.max_hp);source.transformed_by='Muelsyse'}
function openTransformSelect(unit,asGolden=!!unit.golden){document.querySelector('.discover-pop')?.remove();const opts=compact(s.board).filter(x=>x&&x!==unit).map(x=>structuredClone(baseUnitById(x.id)||x)).filter((c,i,a)=>a.findIndex(x=>x.id===c.id)===i);if(!opts.length){log('棋盘上没有可供缪尔赛思选择的棋子。','bad');return}const pop=document.createElement('div');pop.className='discover-pop';pop.innerHTML='<div class="discover-box"><h3>选择缪尔赛思变形目标（'+(asGolden?'金卡版':'普通版')+'）</h3><div class="discover-options">'+opts.map((u,i)=>'<button class="discover-option" onclick="chooseTransform('+i+')">'+card(asGolden?goldenCopy(u):u,'transform',i)+'</button>').join('')+'</div></div>';pop._options=opts;pop._unit=unit;pop._asGolden=asGolden;document.body.appendChild(pop)}

window.chooseDeployTarget=idx=>{const pop=document.querySelector('.discover-pop'),target=pop?._options?.[idx],source=pop?._source,effect=pop?._effect,times=Math.max(1,Number(pop?._times||1));if(!target||!source||!effect)return;document.querySelector('.detail-pop')?.remove();pop.remove();if(effect.type==='select_buff_toggle_guard'){const hadGuard=hasMark(target,'guard');for(let n=0;n<times;n++)applyClientBuff(target,effect.attack||0,effect.max_hp||effect.hp||0,effect.bullet_strength||0);setGuard(target,!hadGuard);log(source.name+' 上场：'+target.name+' 获得 '+times+' 次属性增益，'+(hadGuard?'移除':'获得')+'嘲讽。','good')}else if(effect.type==='select_guard_then_buff_guards'){setGuard(target,true);let applied=0;for(let n=0;n<times;n++)for(const ally of compact(s.board))if(hasMark(ally,'guard')){applyClientBuff(ally,effect.attack||0,effect.max_hp||effect.hp||0,effect.bullet_strength||0);applied++}log(source.name+' 上场：'+target.name+' 获得嘲讽，并对嘲讽友方施加 '+applied+' 次属性增益。','good')}draw()};
function onDeployTriggerCount(){return Math.max(1,...compact(s.board).map(x=>Number(x?.on_deploy_multiplier||1)))}
function synergyMatches(effect,deployed){const faction=effect?.faction||'';return faction==='任意'||deployed?.faction==='任意'||deployed?.faction===faction}
function triggerSynergies(deployed){for(const source of compact(s.board)){const effect=source?.synergy||{};if(source===deployed||!effect.type||!synergyMatches(effect,deployed))continue;const reps=Math.max(1,Number(effect.repetitions||1));let applications=0;for(let n=0;n<reps;n++)for(const ally of compact(s.board)){applyClientBuff(ally,effect.attack||0,effect.max_hp||effect.hp||0,effect.bullet_strength||0,'synergy');applications++}log(source.name+' 协同（'+(effect.faction||'任意')+'）触发：施加 '+applications+' 次增益。','good')}}
function onDeploy(u){triggerSynergies(u);if(u.golden){const i=emptyBench(),sk=goldenRewardCard();if(i>=0){s.bench[i]=sk;log(u.name+' 金卡上场：获得【'+sk.name+'】。','good')}else log('备战区已满，无法获得金卡奖励。','bad')}const eff=u.on_deploy||{},times=onDeployTriggerCount();if(eff.type==='transform_select'){openTransformSelect(u,!!u.golden);return}if(eff.type==='select_buff_toggle_guard'||eff.type==='select_guard_then_buff_guards'){openDeployTargetSelect(u,eff,times);return}if(eff.type==='gain_ammo_pact'){const cnt=Math.max(1,Number(eff.count||1))*times;let got=0,last=null;for(let n=0;n<cnt;n++){const i=emptyBench();if(i<0){log('备战区已满，无法继续获得【铳弹协约】。','bad');break}const sk=skillLv(s.shopLevel);s.bench[i]=sk;last=sk;got++}if(got)log(u.name+' 上场：获得 '+got+' 张【'+(last?last.name:'铳弹协约')+'】。','good')}else if(eff.type==='gain_four_seasons'){const cnt=Math.max(1,Number(eff.count||1))*times;let got=0,last=null;for(let n=0;n<cnt;n++){const i=emptyBench();if(i<0){log('备战区已满，无法继续获得【天有四时】。','bad');break}const sk=fourSeasonsLv(s.shopLevel);if(!sk)break;s.bench[i]=sk;last=sk;got++}if(got)log(u.name+' 上场：获得 '+got+' 张【'+last.name+'】。','good')}else if(eff.type==='gain_random_skill_current_level'){const cnt=Math.max(1,Number(eff.count||1))*times,pool=s.cards.filter(c=>c.card_type==='skill'&&Number(s.shopLevel)>=Number(c.min_shop_level||1)&&(Number(c.cost||0)===Number(s.shopLevel)||(c.available_from_unlock&&Number(s.shopLevel)>=Number(c.min_shop_level||1))));let got=0;for(let n=0;n<cnt;n++){const i=emptyBench();if(i<0){log('备战区已满，无法继续获得随机技能卡。','bad');break}if(!pool.length){log('当前商店等级没有可获得的技能卡。','bad');break}s.bench[i]=structuredClone(pool[Math.floor(Math.random()*pool.length)]);got++}if(got)log(u.name+' 上场：随机获得 '+got+' 张 '+s.shopLevel+' 星技能卡。','good')}else if(eff.type==='gain_harmony_prosperity'){const cnt=Math.max(1,Number(eff.count||1))*times;let got=0,last=null;for(let n=0;n<cnt;n++){const i=emptyBench();if(i<0){log('备战区已满，无法继续获得【和气生财】。','bad');break}const sk=harmonyProsperityLv(s.shopLevel);if(!sk)break;s.bench[i]=sk;last=sk;got++}if(got)log(u.name+' 上场：获得 '+got+' 张【'+last.name+'】。','good')}else if(eff.type==='gain_skill_card'){const template=s.cards.find(c=>c.id===eff.card_id),cnt=Math.max(1,Number(eff.count||1))*times;let got=0;for(let n=0;n<cnt;n++){const i=emptyBench();if(i<0){log('备战区已满，无法继续获得技能卡。','bad');break}if(!template)break;s.bench[i]=structuredClone(template);got++}if(got)log(u.name+' 上场：获得 '+got+' 张【'+template.name+'】。','good')}else if(eff.type==='team_buff'){const a=compact(s.board);let n=0;for(let repeat=0;repeat<times;repeat++)for(const ally of a){if(eff.exclude_self&&ally===u)continue;applyClientBuff(ally,eff.attack||0,eff.max_hp||eff.hp||0,eff.bullet_strength||0);n++}log(u.name+' 上场效果触发 '+times+' 次：共施加 '+n+' 次增益。','good')}}
function grantFourSeasons(source,count,mechanic='招募'){let got=0,last=null;for(let n=0;n<Math.max(0,Number(count||0));n++){const i=emptyBench();if(i<0){log('备战区已满，无法继续获得【天有四时】。','bad');break}const sk=fourSeasonsLv(s.shopLevel);if(!sk)break;s.bench[i]=sk;last=sk;got++}if(got)log(source+' '+mechanic+'：获得 '+got+' 张【'+last.name+'】。','good')}
function recordGoldSpent(amount){const spent=Math.max(0,Number(amount||0));if(!spent)return;for(const u of compact(s.board)){const effect=u.gold_spend||{};if(effect.type!=='gain_four_seasons')continue;const threshold=Math.max(1,Number(effect.threshold||7)),total=Number(u.gold_spent_count||0)+spent,triggers=Math.floor(total/threshold);u.gold_spent_count=total%threshold;if(triggers)grantFourSeasons(u.name,triggers*Math.max(1,Number(effect.count||1)),'累计')}draw()}
function grantFertileSoil(source,count,mechanic='招募'){let got=0,last=null;for(let n=0;n<Math.max(0,Number(count||0));n++){const i=emptyBench();if(i<0){log('备战区已满，无法继续获得【沃土予身】。','bad');break}const sk=fertileSoilLv(s.shopLevel);if(!sk)break;s.bench[i]=sk;last=sk;got++}if(got)log(source+' '+mechanic+'：获得 '+got+' 张【'+last.name+'】。','good')}
function triggerRecruit(u){const e=u?.recruit||{};if(e.type==='gain_four_seasons')grantFourSeasons(u.name,Math.max(1,Number(e.count||1)));else if(e.type==='gain_fertile_soil')grantFertileSoil(u.name,Math.max(1,Number(e.count||1)))}
function triggerPlayerSupports(){for(const u of compact(s.board)){const e=u?.support||{};if(!e||!Object.keys(e).length)continue;const threshold=Math.max(1,Number(e.threshold||1));u.support_count=Number(u.support_count||0)+1;const times=Math.floor(u.support_count/threshold);u.support_count%=threshold;if(e.type==='different_faction_buff'){for(let n=0;n<times;n++)for(let r=0;r<Math.max(1,Number(e.repetitions||1));r++)for(const target of harmonyTargets())applyClientBuff(target,Number(e.attack||0),Number(e.max_hp||e.hp||0),Number(e.bullet_strength||0),'support')}else for(let n=0;n<times;n++)applyClientBuff(u,Number(e.attack||0),Number(e.max_hp||e.hp||0),Number(e.bullet_strength||0),'support')}}
function collectMergePieces(){const a=[];s.board.forEach((u,i)=>{if(u&&u.card_type==='unit'&&(!u.golden||u.id==='Phantom'))a.push({w:'board',i,u})});s.bench.forEach((u,i)=>{if(u&&u.card_type==='unit'&&(!u.golden||u.id==='Phantom'))a.push({w:'bench',i,u})});return a}
function phantomCanReplace(piece,target){if(piece.u.id!=='Phantom'||target.id==='Phantom')return false;const max=Number(piece.u.wildcard_merge_max_tier||(piece.u.golden?6:3));return Number(target.stars||target.tier||0)<=max&&!(piece.u.wildcard_exclude_ids||[]).includes(target.id)}
function findTripleMerge(){const pieces=collectMergePieces(),groups={};for(const p of pieces)if(!p.u.golden)(groups[p.u.id]??=[]).push(p);const exact=Object.values(groups).find(v=>v.length>=3);if(exact)return {base:exact[0].u,occ:exact.slice(0,3)};const targets=[...new Map(pieces.filter(p=>!p.u.golden&&p.u.id!=='Phantom').map(p=>[p.u.id,p.u])).values()];for(const base of targets){const own=pieces.filter(p=>!p.u.golden&&p.u.id===base.id),wild=pieces.filter(p=>phantomCanReplace(p,base));if(own.length>=1&&own.length+wild.length>=3){const selectedOwn=own.slice(0,3);return {base,occ:selectedOwn.concat(wild.slice(0,3-selectedOwn.length))}}}return null}
function tryCombineTriples(){let ch=false;while(true){const plan=findTripleMerge();if(!plan)break;const {base,occ}=plan;if(emptyBench()<0&&!occ.some(o=>o.w==='bench')){log('备战区已满，无法放入合成金卡。','bad');break}const orig=baseUnitById(base.id)||base,copies=occ.map(o=>o.u.id===base.id?o.u:orig);occ.forEach(o=>{s[o.w][o.i]=null});s.board=pad(s.board);const i=emptyBench();s.bench[i]=goldenCopy(base,copies);log('三连合成：'+base.name+' 成为金卡，已回到备战区。','good');ch=true}return ch}
function readDrag(ev){if(s.dragging)return s.dragging;try{return JSON.parse(ev.dataTransfer.getData('text/plain')||'null')}catch{return null}}
function clearDrop(){document.querySelectorAll('.drop-target,.drop-blocked').forEach(e=>e.classList.remove('drop-target','drop-blocked'))}
window.dragCard=(ev,type,index)=>{s.dragging={type,index};ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',JSON.stringify(s.dragging));ev.currentTarget.classList.add('dragging')};
window.dragEnd=ev=>{ev.currentTarget.classList.remove('dragging');setTimeout(()=>{s.dragging=null;clearDrop()},0)};window.leaveDrop=ev=>ev.currentTarget.classList.remove('drop-target','drop-blocked');
window.allowBoardDrop=(ev,pos)=>{if(!readDrag(ev))return;ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add('drop-target')};
function reorderBoardUnit(units,from,gap){if(from<0||from>=units.length||gap<0||gap>units.length||gap===from||gap===from+1)return units;const ordered=units.slice(),[unit]=ordered.splice(from,1);ordered.splice(gap>from?gap-1:gap,0,unit);return ordered}
window.dropToBoardInsert=async(ev,pos)=>{const d=readDrag(ev);if(!d)return;ev.preventDefault();ev.stopPropagation?.();const sk=d.type==='bench'?s.bench[d.index]:null;if(d.type==='bench'&&sk?.card_type==='skill'){await useBenchSkill(d.index,true)}else if(d.type==='bench'&&s.bench[d.index]?.card_type==='unit'){if(compact(s.board).length>=7){log('棋盘已满，无法上场棋子。','bad');clearDrop();draw();return}const u=s.bench[d.index];s.bench[d.index]=null;const a=compact(s.board);a.splice(Math.min(pos,a.length),0,u);s.board=pad(a);onDeploy(u);tryCombineTriples()}else if(d.type==='board'){const a=compact(s.board);s.board=pad(reorderBoardUnit(a,d.index,pos))}clearDrop();draw()};
async function buyShopIndex(i,slot=emptyBench()){if(slot<0)return log('备战区已满','bad');const c=s.shop[i];if(!c||c.card_type!=='unit')return;if(s.gold<UNIT_CARD_COST)return log('金币不足','bad');try{const r=await api('/api/buy',{card_id:c.id,bypass_shop_level:!!c.shop_limit_bypass});syncPlayer(r);s.bench[slot]=structuredClone(c);s.shop[i]=null;recordGoldSpent(r.spent||UNIT_CARD_COST);log('购入 '+c.name,'good');triggerRecruit(s.bench[slot]);tryCombineTriples()}catch(e){log(e.message,'bad')}draw()}

window.allowShopDrop=ev=>{const d=readDrag(ev);if(!d)return;ev.preventDefault();const sk=d.type==='bench'?s.bench[d.index]:null,ok=(d.type==='bench'&&(sk?.card_type==='unit'||sk?.effect==='upgrade_shop_unit_transform'||sk?.effect==='angel_blessing'))||d.type==='board';ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add(ok?'drop-target':'drop-blocked')};
window.dropToShop=async ev=>{const d=readDrag(ev);if(!d)return;ev.preventDefault();ev.stopPropagation?.();const sk=d.type==='bench'?s.bench[d.index]:null,targetSlot=Math.max(0,Number(ev.currentTarget?.dataset?.slot||1)-1);if(sk?.effect==='upgrade_shop_unit_transform')await useShopTransformSkill(d.index,targetSlot);else if(sk?.effect==='angel_blessing')await useAngelBlessing(d.index,targetSlot);else await sellCard(d.type,d.index);clearDrop();draw()};
async function useShopTransformSkill(skillIndex,shopIndex){const sk=s.bench[skillIndex],target=s.shop[shopIndex];if(!sk||sk.effect!=='upgrade_shop_unit_transform'||!target?.card_type)return log('请将技能卡拖至一个商店棋子。','bad');const currentTier=Number(target.stars||target.tier||1);if(currentTier>=6)return log('6星棋子无法继续提升星级。','bad');const nextTier=currentTier+1,pool=s.cards.filter(c=>c.card_type==='unit'&&Number(c.stars||c.tier||0)===nextTier);if(!pool.length)return log('没有可变成的更高星棋子。','bad');const replacement=structuredClone(pool[Math.floor(Math.random()*pool.length)]),atk=Number(target.attack||0)+Number(sk.transform_buff||sk.effect_value||0),hp=Number(target.max_hp||1)+Number(sk.transform_buff||sk.effect_value||0);replacement.attack=atk;replacement.max_hp=hp;replacement.current_hp=hp;s.shop[shopIndex]=replacement;s.bench[skillIndex]=null;log(sk.name+'：商店棋子变为 '+replacement.name+'，并保留强化后的属性 '+atk+'/'+hp+'。','good');triggerPlayerSupports();draw()}
function chooseBlessingStat(target){return new Promise(resolve=>{document.querySelector('.discover-pop')?.remove();const pop=document.createElement('div');pop.className='discover-pop';pop.innerHTML='<div class="discover-box"><h3>天使的祝福：选择 '+esc(target.name)+' 翻倍的属性</h3><div class="discover-options"><button class="btn gold" onclick="chooseBlessingPick(\'attack\')">攻击翻倍</button><button class="btn gold" onclick="chooseBlessingPick(\'hp\')">生命翻倍</button></div></div>';pop._resolve=resolve;document.body.appendChild(pop)})}
window.chooseBlessingPick=kind=>{const pop=document.querySelector('.discover-pop'),resolve=pop?._resolve;if(!resolve)return;pop.remove();resolve(kind)};
async function useAngelBlessing(skillIndex,shopIndex){const sk=s.bench[skillIndex],target=s.shop[shopIndex];if(!sk||sk.effect!=='angel_blessing'||target?.card_type!=='unit')return log('请将技能卡拖至一个商店棋子。','bad');const kind=await chooseBlessingStat(target);if(kind==='attack')target.attack=Number(target.attack||0)*2;else if(kind==='hp'){const oldMax=Number(target.max_hp||1),oldHp=Number(target.current_hp??oldMax);target.max_hp=oldMax*2;target.current_hp=oldHp*2}else return;s.bench[skillIndex]=null;log(sk.name+'：'+target.name+' 的'+(kind==='attack'?'攻击':'生命')+'翻倍。','good');triggerPlayerSupports();draw()}
function chooseThree(title,options){return new Promise(resolve=>{document.querySelector('.discover-pop')?.remove();const opts=options.slice(0,3);if(!opts.length)return resolve(null);const pop=document.createElement('div');pop.className='discover-pop';pop.innerHTML='<div class="discover-box"><h3>'+esc(title)+'</h3><div class="discover-options">'+opts.map((x,i)=>'<button class="discover-option" onclick="chooseSalePick('+i+')">'+card(x,'sale-pick',i)+'</button>').join('')+'</div></div>';pop._options=opts;pop._resolve=resolve;document.body.appendChild(pop)})}
window.chooseSalePick=idx=>{const pop=document.querySelector('.discover-pop'),u=pop?._options?.[idx],resolve=pop?._resolve;if(!u||!resolve)return;document.querySelector('.detail-pop')?.remove();pop.remove();resolve(structuredClone(u))};
function enemyPickOptions(){return shuffle(compact(s.enemy).filter(x=>x?.card_type==='unit'&&x.id!=='Ines'&&Number(x.stars||x.tier||0)<=Number(s.shopLevel)).map(x=>structuredClone(baseUnitById(x.id)||x))).slice(0,3)}

function gainSalePick(u,source){const i=emptyBench();if(i<0){log('备战区已满，无法加入挑选的棋子。','bad');return false}s.bench[i]=u;log(source+' 售出：通过挑选获得 '+u.name+'。','good');triggerRecruit(s.bench[i]);tryCombineTriples();draw();return true}
async function triggerSale(u){const e=u?.sell||{};if(e.type==='gift_exchange_and_upgrade_shop'){let got=0;for(let n=0;n<Math.max(1,Number(e.count||1));n++){const i=emptyBench(),sk=giftExchangeLv(s.shopLevel);if(i<0||!sk){log('备战区已满，无法继续获得【礼尚往来】。','bad');break}s.bench[i]=sk;got++}s.shop=s.shop.map(card=>{if(!card||card.card_type!=='unit')return card;const tier=Math.min(6,Number(card.stars||card.tier||1)+1),pool=s.cards.filter(x=>x.card_type==='unit'&&Number(x.stars||x.tier||0)===tier);if(!pool.length)return card;const replacement=structuredClone(pool[Math.floor(Math.random()*pool.length)]);replacement.shop_limit_bypass=true;return replacement});if(got)log(u.name+' 售出：获得 '+got+' 张【礼尚往来.'+s.shopLevel+'】，商店棋子星级提升。','good');return}if(e.type!=='pick_enemy'&&e.type!=='pick_shop_tier_add_self_stats')return;const count=Math.max(1,Number(e.count||1));for(let n=0;n<count;n++){if(emptyBench()<0){log('备战区已满，无法继续挑选棋子。','bad');break}const enemy=e.type==='pick_enemy',opts=enemy?enemyPickOptions():shopTierPickOptions();if(!opts.length){log(enemy?'对手没有可供伊内丝挑选的棋子。':'当前商店等级没有可供赫德雷挑选的棋子。','bad');break}const picked=await chooseThree(u.name+'：挑选（'+(n+1)+'/'+count+'）',opts);if(!picked)break;if(!enemy){const addAtk=Number(u.attack||0),addHp=Number(u.max_hp||0),oldHp=Number(picked.max_hp||1);picked.attack=Number(picked.attack||0)+addAtk;picked.max_hp=oldHp+addHp;picked.current_hp=picked.max_hp}if(!gainSalePick(picked,u.name))break}}
async function sellCard(w,i){let u=null;if(w==='bench')u=s.bench[i];else if(w==='board')u=compact(s.board)[i];if(!u||u.card_type!=='unit')return;try{const r=await api('/api/sell',{card_id:u.id});syncPlayer(r);if(w==='bench')s.bench[i]=null;else{const a=compact(s.board);a.splice(i,1);s.board=pad(a)}await triggerSale(u);log('出售 '+u.name+'：返还 '+(r.refund||1)+' 金币。','good')}catch(e){log(e.message,'bad')}}

async function animateAssimilate(side,from,to){const source=cardEl(side==='left'?'board':'enemy',from),target=cardEl(side==='left'?'board':'enemy',to);if(!source||!target)return sleep(180);const a=source.getBoundingClientRect(),b=target.getBoundingClientRect();target.style.transition='transform .42s ease-in,opacity .42s ease-in';target.style.zIndex='8';target.style.transform='translate('+(a.left-b.left)+'px,'+(a.top-b.top)+'px) scale(.25)';target.style.opacity='0';await sleep(440)}
async function animatePrepAssimilate(source,target){draw();await sleep(20);const units=compact(s.board),si=units.indexOf(source),ti=units.indexOf(target);if(si<0||ti<0)return;await animateAssimilate('left',si+1,ti+1)}
async function animateBullet(side,from,toSide,to){const sourceBoard=side==='left'?'board':'enemy',fallback=s.assimilatedSources[side+':'+from],a=cardEl(sourceBoard,from)||cardEl(sourceBoard,fallback),b=cardEl(toSide==='left'?'board':'enemy',to);if(!a||!b)return sleep(120);const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),sx=ar.left+ar.width/2,sy=ar.top+ar.height/2,tx=br.left+br.width/2,ty=br.top+br.height/2,el=document.createElement('div');el.className='bullet';el.style.left='0px';el.style.top='0px';document.body.appendChild(el);try{await el.animate([{transform:'translate('+sx+'px,'+sy+'px) translate(-50%,-50%)'},{transform:'translate('+tx+'px,'+ty+'px) translate(-50%,-50%)'}],{duration:320,easing:'linear'}).finished}catch{}el.remove()}
async function animateCollision(ev){const a=cardEl(ev.side==='left'?'board':'enemy',ev.from_slot),b=cardEl(ev.target_side==='left'?'board':'enemy',ev.to_slot);if(!a||!b)return sleep(150);const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),dx=(br.left-ar.left)*.45,dy=(br.top-ar.top)*.45,ghost=a.cloneNode(true);ghost.classList.add('attacking','collision-ghost');Object.assign(ghost.style,{left:ar.left+'px',top:ar.top+'px',width:ar.width+'px',height:ar.height+'px'});document.body.appendChild(ghost);a.style.visibility='hidden';try{await ghost.animate([{transform:'translate(0,0)'},{transform:'translate('+dx+'px,'+dy+'px)',offset:.58},{transform:'translate(0,0)'}],{duration:480,easing:'ease-in-out'}).finished}catch{}ghost.remove();a.style.visibility=''}
async function animateCleave(ev){const b=cardEl(ev.target_side==='left'?'board':'enemy',ev.to_slot);if(!b)return sleep(120);const r=b.getBoundingClientRect(),el=document.createElement('div');el.className='cleave-slash';el.style.left=(r.left+r.width/2)+'px';el.style.top=(r.top+r.height/2)+'px';document.body.appendChild(el);try{await el.animate([{opacity:0,transform:'translate(-50%,-50%) rotate(-8deg) scaleX(.25)'},{opacity:1,transform:'translate(-50%,-50%) rotate(-8deg) scaleX(1.25)'},{opacity:0,transform:'translate(-50%,-50%) rotate(-8deg) scaleX(1.55)'}],{duration:360,easing:'ease-out'}).finished}catch{}el.remove()}
function applyEventLog(ev){if(ev.type==='gain_gold')return log((ev.from||'棋子')+' 后勤：获得 '+(ev.amount||0)+' 枚金币。','good');if(ev.type==='assimilate')return log((ev.from||'妮芙')+' 兼并 '+(ev.to||'友方棋子')+'，获得其属性'+(ev.legacy_count?'与遗计':'')+'。','good');if(ev.type==='revive_failed')return log((ev.from||'棋子')+' 复活时棋盘已满，被挤出战斗。','bad');if(ev.type==='shield_block')return log((ev.from||'')+' 的护盾抵挡了来自 '+(ev.source||'敌人')+' 的 '+(ev.damage_blocked||0)+' 点伤害。','good');if(['team_buff','logistics_buff','temporary_logistics_buff','temporary_initiative_buff','permanent_buff'].includes(ev.type))return log((ev.from||'')+' 使 '+(ev.to||'')+' 获得增益','good');if(ev.type==='gain_card'){if(ev.side==='left'){const i=emptyBench();if(i>=0)s.bench[i]=ev.card;return log((ev.from||'')+' 获得【'+ev.card_name+'】','good')}return log('敌方 '+(ev.from||'')+' 触发获得【'+ev.card_name+'】。')}if(ev.type==='revive')return log(ev.from+' 复活。','good');if(ev.type==='summon')return log(ev.from+' 召唤 '+ev.unit.name+'。','good');if(ev.damage!==undefined){const dtype=ev.damage_type==='bullet'?'铳弹伤害':ev.damage_type==='spell'?'法术伤害':ev.damage_type==='cleave'?'横斩':'碰撞';log(ev.from+' 对 '+ev.to+' 造成 '+ev.damage+' '+dtype+(ev.counter_damage?'，反伤 '+ev.counter_damage:''));}}
function eventUnit(side,slot){const arr=side==='left'?s.board:s.enemy;return arr&&arr[slot-1]}
function applyBattleEventState(ev){if(ev.type==='assimilate'){const source=eventUnit(ev.side,ev.slot),target=eventUnit(ev.side,ev.to_slot),arr=ev.side==='left'?s.board:s.enemy;s.assimilatedSources[ev.side+':'+ev.to_slot]=ev.slot;if(source){source.attack=ev.attack;source.max_hp=ev.max_hp;source.current_hp=ev.current_hp;if(ev.legacy_count)source.mechanics=[...new Set([...(source.mechanics||[]),'legacy'])]}if(target)arr[ev.to_slot-1]=null;return}if(ev.type==='assimilate_remove'){const arr=ev.side==='left'?s.board:s.enemy;arr[ev.slot-1]=null;return}if(ev.type==='shield_block'){const u=eventUnit(ev.side,ev.slot);if(u){u.shield=false;u.mechanics=(u.mechanics||[]).filter(m=>m!=='shield')}return}if(ev.damage!==undefined){const a=eventUnit(ev.side,ev.from_slot),t=eventUnit(ev.target_side,ev.to_slot);if(a&&ev.attacker_hp!==undefined)a.current_hp=ev.attacker_hp;if(t&&ev.target_hp!==undefined)t.current_hp=ev.target_hp}if(['team_buff','logistics_buff','temporary_logistics_buff','temporary_initiative_buff','permanent_buff'].includes(ev.type)){const u=eventUnit(ev.side,ev.slot);if(u){for(const k of ['attack','max_hp','current_hp','bullet_strength','bullet_damage'])if(ev[k]!==undefined)u[k]=ev[k]}}if(ev.type==='revive'&&ev.unit){const arr=ev.side==='left'?s.board:s.enemy;arr[ev.slot-1]=structuredClone(ev.unit)}if(ev.type==='summon'&&ev.unit){const arr=ev.side==='left'?s.board:s.enemy;arr[ev.slot-1]=structuredClone(ev.unit)}if(ev.type==='grant_revive'){const u=eventUnit(ev.side,ev.to_slot);if(u){u.revive=true;u.mechanics=[...new Set([...(u.mechanics||[]),'revive'])]}}}
async function animateEvents(res){const events=res.events||[];let i=0;while(i<events.length){if(s.skipBattle)break;const ev=events[i];if(ev.damage_type==='bullet'&&ev.source_effect==='legacy'&&/^W(?:·|$)/.test(ev.from||'')){const batch=[];let j=i;while(j<events.length){const x=events[j];if(x.damage_type==='bullet'&&x.source_effect==='legacy'&&/^W(?:·|$)/.test(x.from||''))batch.push(x);else if(['cumulative_counter','permanent_buff'].includes(x.type)){}else break;j++}await Promise.all(batch.map(x=>animateBullet(x.side,x.from_slot,x.target_side,x.to_slot)));for(;i<j;i++){applyBattleEventState(events[i]);draw();applyEventLog(events[i])}await sleep(140);continue}if(ev.type==='assimilate')await animateAssimilate(ev.side,ev.from_slot,ev.to_slot);else if(ev.damage_type==='bullet')await animateBullet(ev.side,ev.from_slot,ev.target_side,ev.to_slot);else if(ev.damage_type==='collision')await animateCollision(ev);else if(ev.damage_type==='cleave')await animateCleave(ev);applyBattleEventState(ev);draw();applyEventLog(ev);await sleep(140);i++}s.board=res.left;s.enemy=res.right;draw();await sleep(1000)}
async function refresh(){if(s.busy||s.phase!=='备战')return;try{if(s.freeRefreshes>0){s.shop=await api('/api/shop');s.freeRefreshes--;log('免费刷新商店，剩余 '+s.freeRefreshes+' 次。','good')}else{const r=await api('/api/refresh',{});syncPlayer(r);recordGoldSpent(r.spent||1);s.shop=r.shop}draw()}catch(e){log(e.message,'bad')}}
async function upgradeShop(){try{const r=await api('/api/upgrade_shop',{});syncPlayer(r);recordGoldSpent(r.spent||0);log('商店升到 Lv.'+s.shopLevel,'good');draw()}catch(e){log(e.message,'bad')}}
async function loadEnemy(){s.enemy=await api('/api/enemy',{round:s.round});draw()}
function intrinsicDefenseSource(u){const base=baseUnitById(u.id);if(!base)return u;return u.golden?applyGoldenOverrides(structuredClone(base)):base}
function inheritDefenses(target,victim){const source=intrinsicDefenseSource(victim),defs=['guard','shield','lock_hp','stealth','revive'];target.mechanics=[...(target.mechanics||[])];for(const k of defs)if(hasMark(source,k)){target[k]=true;if(!target.mechanics.includes(k))target.mechanics.push(k)}}
async function resolveReturnCampEffects(){for(const source of compact(s.board)){const effect=source.return_camp||{};if(effect.type==='gain_fertile_soil')grantFertileSoil(source.name,Math.max(1,Number(effect.count||1)),'回营')}const sources=compact(s.board).filter(u=>(u.return_camp||{}).type==='assimilate_left_defenses_gain_gold');for(const source of sources){const units=compact(s.board),idx=units.indexOf(source);if(idx<=0)continue;const victim=units[idx-1],effect=source.return_camp||{};await animatePrepAssimilate(source,victim);const hp=Number(victim.max_hp||0);source.attack=Number(source.attack||0)+Number(victim.attack||0);source.max_hp=Number(source.max_hp||1)+hp;source.current_hp=Number(source.current_hp??source.max_hp-hp)+hp;inheritDefenses(source,victim);units.splice(idx-1,1);s.board=pad(units);try{const r=await api('/api/gain_gold',{amount:Number(effect.gold||0)});syncPlayer(r);log(source.name+' 回营：兼并 '+victim.name+'，获得其属性与防御机制，并获得 '+Number(effect.gold||0)+' 金币。','good')}catch(e){log(e.message,'bad')}draw()}}
async function startPrep(){clearInterval(s.timer);s.phase='备战';s.busy=true;s.skipBattle=false;s.skipBattleAvailable=false;s.prepSeconds=PREP_TIMES[Math.min(s.round-1,PREP_TIMES.length-1)]||90;if(s.pendingNextRoundGold>0){try{const amount=s.pendingNextRoundGold,r=await api('/api/gain_gold',{amount});s.pendingNextRoundGold=0;syncPlayer(r);log('【有备无患】：获得 '+amount+' 金币。','good')}catch(e){log(e.message,'bad')}}await resolveReturnCampEffects();s.busy=false;loadEnemy();s.timer=setInterval(()=>{if(s.phase!=='备战'){clearInterval(s.timer);return}s.prepSeconds=Math.max(0,s.prepSeconds-1);if(s.prepSeconds<=0){clearInterval(s.timer);fight();return}draw()},1000);draw()}
function cleanupAfterBattle(u){if(!u)return u;const x=structuredClone(u);if(x.temporary_initiative_mechanic_added)x.mechanics=(x.mechanics||[]).filter(m=>m!=='initiative');for(const k of ['current_hp','bullet_strength_temp','temporary_revive','summoned_by_phase','summoned_by_revival','summoned_by_legacy','death_feud_count','revive_consumed_by_summon','temporary_logistics_hp','temporary_logistics_attack','temporary_initiative_effects','temporary_initiative_mechanic_added','battle_shop_level','venom_consumed','_venom_destroyed','_killer_index','inherited_legacies','opponent_attack_trigger_count'])delete x[k];return x}
function restoreBoardAfterBattle(before,after,persistent){return pad(before.map((orig,i)=>{const r=after&&after[i],saved=persistent&&persistent[i];const merged=structuredClone(orig);if(saved&&saved.id===orig.id){for(const k of ['attack','max_hp','bullet_strength','bullet_damage','injury_growth_count'])if(saved[k]!==undefined)merged[k]=Number(saved[k])}if(r&&r.id===orig.id)for(const k of ['cumulative_damage_count','mostima_damage_count','injury_growth_count'])if(r[k]!==undefined)merged[k]=r[k];return cleanupAfterBattle(merged)}))}
function showGameResult(won){clearInterval(s.timer);s.phase=won?'已通关':'游戏失败';s.busy=true;s.skipBattle=true;s.skipBattleAvailable=false;const units=compact(s.board),attack=units.reduce((n,u)=>n+Number(u.attack||0),0),hp=units.reduce((n,u)=>n+Number(u.max_hp||0),0),strength=units.reduce((n,u)=>n+bp(u)+Number(u.bullet_damage||0),0),score=attack+hp+strength*2+Number(s.totalGoldEarned||0)*5+Number(s.hp||0)*10,rows=units.length?units.map(u=>'<div class="victory-unit"><b>'+esc(u.name)+'</b><span>攻击 '+Number(u.attack||0)+'</span><br><span>血量 '+Number(u.max_hp||0)+'</span>'+(bp(u)+Number(u.bullet_damage||0)>0?'<br><span>铳弹强度 +'+(bp(u)+Number(u.bullet_damage||0))+'</span>':'')+'</div>').join(''):'<div class="victory-unit">场上没有棋子</div>',overlay=$('#victoryOverlay');overlay.classList.toggle('defeat',!won);overlay.innerHTML='<div class="victory-box"><div class="victory-title">'+(won?'YOU WIN!':'YOU LOSE!')+'</div><div class="victory-sub">'+(won?'你赢了！':'你输了！')+'</div><div class="victory-units">'+rows+'</div><div class="victory-score">分值：'+score+'</div><button class="btn primary" onclick="location.reload()">新游戏</button></div>';overlay.classList.remove('hidden');draw()}function showVictory(){showGameResult(true)}function showDefeat(){showGameResult(false)}
async function fight(){if(s.busy||s.phase!=='备战')return;clearInterval(s.timer);s.prepSeconds=Math.max(0,s.prepSeconds);const preBattle=compact(s.board).map(u=>structuredClone(u));s.assimilatedSources={};s.busy=true;for(const u of compact(s.board))u.current_hp=u.max_hp;s.phase='战斗中';draw();setTimeout(()=>{if(s.phase==='战斗中'){s.skipBattleAvailable=true;draw()}},30000);try{const res=await api('/api/battle',{left:compact(s.board),right:compact(s.enemy),round:s.round});await animateEvents(res);syncPlayer(res);if(s.battleWagers>0&&(res.winner==='left'||res.winner==='draw')){const amount=s.battleWagers*(res.winner==='left'?3:1),gr=await api('/api/gain_gold',{amount});syncPlayer(gr);log('【料敌机先】：获得 '+amount+' 金币。','good')}s.battleWagers=0;if(res.winner==='left')log('战斗胜利！','good');else if(res.winner==='draw')log('战斗平局。');else log('战斗失败！扣除 '+(res.loss_damage||0)+' 点生命。','bad');s.board=restoreBoardAfterBattle(preBattle,res.left,res.persistent_left);if(Number(s.hp)<=0){showDefeat();return}if(Number(res.round||s.round)>14||Number(s.round)>14){showVictory();return}if(!s.shopLocked)s.shop=await api('/api/shop');s.shopLocked=false;await startPrep()}catch(e){log(e.message,'bad');s.board=pad(preBattle);s.phase='备战';s.busy=false;draw()}}
function requestSkipBattle(){if(s.phase==='战斗中'&&s.skipBattleAvailable){s.skipBattle=true;log('已跳过对战动画。')}}
window.choose=async(w,i)=>{if(w==='shop')return buyShopIndex(i);if(w==='bench'&&s.bench[i]){if(await useBenchSkill(i))return;draw()}};window.rightClickCard=(ev,w,i)=>showCardDetail(ev,w,i);document.addEventListener('click',ev=>{if(!ev.target.closest('.detail-pop'))document.querySelector('.detail-pop')?.remove()});
async function start(){if(s.started)return;s.started=true;const p=await api('/api/reset',{});syncPlayer(p);s.cards=await api('/api/cards');s.board=Array(7).fill(null);s.enemy=Array(7).fill(null);s.bench=Array(12).fill(null);s.shopLocked=false;s.fertileSoilGrowth=0;s.pendingNextRoundGold=0;s.battleWagers=0;s.freeRefreshes=0;s.totalGoldEarned=Number(p.total_gold_earned||3);s.shop=await api('/api/shop');$('#startScreen').classList.add('hidden');$('#gameShell').classList.remove('hidden');log('第 1 回合开始。');await startPrep()}
function setView(mode){document.body.classList.toggle('landscape',mode==='landscape');document.body.classList.toggle('portrait',mode==='portrait');$('#landscapeView').classList.toggle('active',mode==='landscape');$('#portraitView').classList.toggle('active',mode==='portrait')}$('#startGame').onclick=()=>start().catch(e=>{s.started=false;alert('启动失败：'+e.message)});$('#landscapeView').onclick=()=>setView('landscape');$('#portraitView').onclick=()=>setView('portrait');$('#refresh').onclick=refresh;$('#upgrade').onclick=upgradeShop;$('#lockShop').onclick=()=>{s.shopLocked=!s.shopLocked;log(s.shopLocked?'商店已锁定。':'已取消商店锁定。');draw()};$('#fight').onclick=fight;$('#skip').onclick=requestSkipBattle;$('#sell').onclick=()=>log('请将棋子拖入商店出售。');$('#reset').onclick=async()=>{await api('/api/reset',{});location.reload()};setView('landscape');
</script></body></html>
