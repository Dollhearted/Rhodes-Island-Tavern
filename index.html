<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒馆自走棋</title>
<style>
:root{--bg:#101722;--p:#1d2a3b;--l:#3a4d65;--g:#ffcf58;--t:#eef5ff;--m:#9db0c9;--ok:#78dc9c;--bad:#ff8192}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#304b71,#101722 55%);color:var(--t);font:14px "Microsoft YaHei",sans-serif}main,header{max-width:1050px;margin:auto;padding:16px 22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}.sub,.hint{color:var(--m);font-size:12px;margin-top:5px}.stats{display:flex;gap:10px}.stat{border:1px solid var(--l);border-radius:9px;padding:6px 12px;background:#192536}.stat b{display:block;color:var(--g);font-size:18px}.panel{background:#192536e8;border:1px solid var(--l);border-radius:13px;padding:14px;margin-bottom:15px}h2{font-size:13px;letter-spacing:1px;margin:0 0 10px;color:#b9c9e0}.board{display:flex;justify-content:center;align-items:center;gap:8px;min-height:105px;padding:10px;background:#0c121c;border-radius:999px;border:1px solid #27384e;overflow:visible}.board .slot{flex:0 0 calc((100% - 48px)/7)}.board>.card{flex:0 0 calc((100% - 48px)/7);max-width:130px;width:auto}.board>.insert-slot{flex:0 0 44px;min-height:74px;border-style:dotted}.slot{min-height:83px;border:1px dashed #41536a;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative}.slot:before{content:attr(data-slot);font-size:10px;color:#63748b;position:absolute;top:3px;left:5px}.enemy .slot{background:#2a1a22}.card{width:92%;min-height:65px;border:2px solid var(--c);border-radius:8px;background:#172638;padding:6px;cursor:pointer;box-shadow:0 0 10px #0004}.card:hover{filter:brightness(1.18)}.card[draggable="true"]{cursor:grab}.card[draggable="true"]:active{cursor:grabbing}.card.dragging{opacity:.55;filter:brightness(1.25)}.card.attacking{z-index:5;transition:transform .22s ease-in-out;filter:brightness(1.35)}.card.active{box-shadow:0 0 18px var(--g),0 0 0 3px #ffcf5888;filter:brightness(1.25)}.card.selected{outline:2px solid var(--g);outline-offset:2px}.slot.drop-target{border-color:var(--ok);background:#183323;box-shadow:0 0 0 2px #78dc9c55}.slot.drop-blocked{border-color:var(--bad);background:#321820}.card.skill{background:#2a2538}.card.dead{opacity:.25;filter:grayscale(1)}.name{font-weight:bold;font-size:12px}.info{font-size:10px;color:#bdd0eb;margin-top:5px}.hp{height:4px;background:#35445a;border-radius:4px;margin-top:6px;overflow:hidden}.hp i{display:block;height:100%;background:var(--ok)}.bench,.shop{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.bench .slot{min-height:82px}.shop{grid-template-columns:repeat(6,1fr)}.shop .card{width:100%;min-height:95px}.cost{color:var(--g);float:right}.controls{display:flex;gap:8px;margin-top:13px}.btn{border:0;border-radius:8px;background:#355477;color:white;padding:9px 13px;font-weight:bold;cursor:pointer}.btn.primary{background:#3d8dc0}.btn.gold{background:#8e6925}.btn:disabled{opacity:.45}.log{max-height:220px;overflow:auto;color:#c7d6e9;font-size:12px}.log div{padding:5px 0;border-bottom:1px solid #304158}.good{color:var(--ok)}.bad{color:var(--bad)}@media(max-width:700px){main,header{padding:12px}.bench{grid-template-columns:repeat(4,1fr)}.shop{grid-template-columns:repeat(3,1fr)}.slot{min-height:68px}.card{font-size:11px}.stats{gap:4px}.stat{padding:4px 6px}}
</style><body><header><div><h1>♜ 酒馆自走棋</h1><div class="sub">单人 14 轮闯关 · 1×7 对战棋盘 · 12 格备战区</div></div><div class="stats"><div class="stat">生命<b id="hp">50</b></div><div class="stat">金币<b id="gold">10</b></div><div class="stat">下轮收入<b id="income">11</b></div><div class="stat">回合<b id="round">第 1/14 轮</b></div><div class="stat">阶段<b id="phase">备战 30s</b></div></div></header><main>
<section class="panel enemy"><h2>下一轮 AI 阵容预览（1 × 7）</h2><div class="board" id="enemy"></div><div class="hint">备战期间可查看下一轮敌方棋子、星级、攻击与初始血量；战斗将使用这批固定敌人。</div></section><section class="panel"><h2>我的棋盘（1 × 7）</h2><div class="board" id="board"></div><div class="hint">拖动备战区棋子到棋盘空格部署；点击备战区棋子可选中后出售。上场棋子锁定，点击后会直接出售。技能卡点击后再点击己方棋子使用。</div></section>
<section class="panel"><h2>备战区（12 张卡牌：棋子 + 技能）</h2><div class="bench" id="bench"></div></section><section class="panel"><h2>酒馆商店</h2><div class="shop" id="shop"></div><div class="controls"><button class="btn gold" id="refresh">刷新（1 金币）</button><button class="btn gold" id="upgrade">升级商店</button><button class="btn primary" id="fight">开始对战</button><button class="btn" id="skip">跳过备战</button><button class="btn" id="sell">出售选中</button><button class="btn" id="reset">新游戏</button></div></section><section class="panel"><h2>战报</h2><div class="log" id="log"></div></section></main>
<script>
const playerId=localStorage.autochessPlayerId||(localStorage.autochessPlayerId='p-'+crypto.randomUUID());
const api=(url,body)=>fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json','X-Player-Id':playerId},body:JSON.stringify(body)}:{headers:{'X-Player-Id':playerId}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});
const PREP_TIMES=[30,30,30,45,45,60,60,90,90,90,90,90,90,90];
const s={gold:10,hp:50,round:1,board:Array(7).fill(null),enemy:Array(7).fill(null),bench:Array(12).fill(null),shop:[],selected:null,dragging:null,shopLevel:1,upgradeCost:5,nextIncome:11,shopSlots:4,busy:false,phase:'\u5907\u6218',prepSeconds:30,timer:null};
const $=x=>document.querySelector(x);
const log=(x,c='')=>$('#log').insertAdjacentHTML('afterbegin',`<div class="${c}">${x}</div>`);
const live=u=>u&&u.current_hp!==undefined?u.current_hp:u?.max_hp;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function compactTeam(team){return team.filter(Boolean).slice(0,7)}
function padTeam(team){const c=compactTeam(team);return c.concat(Array(7-c.length).fill(null))}

function card(u,where,i){
  if(!u)return '';
  const skill=u.card_type==='skill';
  const hp=live(u),max=u.max_hp||1;
  const canDrag=(where==='bench'||where==='shop'||where==='board')&&!skill&&s.phase==='\u5907\u6218'&&!s.busy;
  const classes=['card',skill?'skill':'',where==='bench'&&s.selected===i?'selected':'',hp<=0?'dead':''].filter(Boolean).join(' ');
  const dragAttrs=canDrag?` draggable="true" ondragstart="dragCard(event,'${where}',${i})" ondragend="dragEnd(event)"`:'';
  const dataAttrs=` data-side="${where}" data-slot="${i+1}"`;
  return `<div class="${classes}" style="--c:${u.color}" onclick="choose('${where}',${i})" oncontextmenu="rightClickCard(event,'${where}',${i})"${dataAttrs}${dragAttrs}><div class="name">${u.name}<span class="cost">${u.cost||''}\u25c6</span></div><div class="info">${skill?u.description:`\u653b ${u.attack}\u3000\u8840 ${Math.max(0,hp)}/${max}`}</div>${skill?'':`<div class="hp"><i style="width:${Math.max(0,hp/max*100)}%"></i></div>`}</div>`;
}

function insertSlot(pos){
  return `<div class="slot insert-slot" data-slot="+" ondragenter="allowBoardDrop(event,${pos})" ondragover="allowBoardDrop(event,${pos})" ondragleave="leaveDrop(event)" ondrop="dropToBoardInsert(event,${pos})"></div>`;
}

function renderBoard(where){
  if(s.phase==='\u6218\u6597\u4e2d')return s[where].map((u,i)=>u?card(u,where,i):'').join('');
  const units=compactTeam(s[where]);
  if(where==='board'){
    let html=units.length<7?insertSlot(0):'';
    units.forEach((u,i)=>{html+=card(u,'board',i);if(units.length<7)html+=insertSlot(i+1)});
    return html||insertSlot(0);
  }
  return units.map((u,i)=>card(u,where,i)).join('');
}

function draw(){
  if(s.phase==='\u5907\u6218')s.board=padTeam(s.board);
  $('#enemy').innerHTML=renderBoard('enemy');
  $('#board').innerHTML=renderBoard('board');
  $('#bench').innerHTML=s.bench.map((u,i)=>`<div class="slot" data-slot="${i+1}" ondragenter="allowBenchDrop(event,${i})" ondragover="allowBenchDrop(event,${i})" ondragleave="leaveDrop(event)" ondrop="dropToBench(event,${i})">${card(u,'bench',i)}</div>`).join('');
  while(s.shop.length<s.shopSlots)s.shop.push(null);
  $('#shop').innerHTML=s.shop.map((u,i)=>`<div class="slot" data-slot="${i+1}">${card(u,'shop',i)}</div>`).join('');
  $('#gold').textContent=s.gold;
  $('#hp').textContent=s.hp;
  $('#income').textContent=s.nextIncome;
  $('#round').textContent=`\u7b2c ${Math.min(s.round,14)}/14 \u8f6e`;
  $('#phase').textContent=s.phase==='\u5907\u6218'?`\u5907\u6218 ${s.prepSeconds}s`:s.phase;
  $('#fight').disabled=s.busy||s.phase!=='\u5907\u6218';
  $('#skip').disabled=s.busy||s.phase!=='\u5907\u6218';
  $('#refresh').disabled=s.busy||s.phase!=='\u5907\u6218';
  $('#upgrade').textContent=s.shopLevel>=6?'\u5546\u5e97\u6ee1\u7ea7':`\u5347\u7ea7\u5546\u5e97\uff08${s.upgradeCost} \u91d1\u5e01\uff5cLv.${s.shopLevel}\uff09`;
  $('#upgrade').disabled=s.busy||s.phase!=='\u5907\u6218'||s.shopLevel>=6;
  $('#sell').disabled=s.busy||s.selected===null||!s.bench[s.selected]||s.bench[s.selected].card_type!=='unit';
}

function canDeployFromBench(from,pos){
  const unit=s.bench[from],units=compactTeam(s.board);
  return !s.busy&&s.phase==='\u5907\u6218'&&Number.isInteger(from)&&Number.isInteger(pos)&&from>=0&&from<s.bench.length&&pos>=0&&pos<=units.length&&units.length<7&&unit&&unit.card_type==='unit';
}

function deployFromBenchInsert(from,pos){
  if(!canDeployFromBench(from,pos))return false;
  const unit=s.bench[from],units=compactTeam(s.board);
  units.splice(pos,0,{...unit,current_hp:unit.max_hp});
  s.board=padTeam(units);
  s.bench[from]=null;
  if(s.selected===from)s.selected=null;
  log(`\u90e8\u7f72 ${unit.name}`,'good');
  return true;
}
function canMoveBoard(from,pos){
  const units=compactTeam(s.board);
  return !s.busy&&s.phase==='\u5907\u6218'&&Number.isInteger(from)&&Number.isInteger(pos)&&from>=0&&from<units.length&&pos>=0&&pos<=units.length;
}

function moveBoardInsert(from,pos){
  if(!canMoveBoard(from,pos))return false;
  const units=compactTeam(s.board);
  const [unit]=units.splice(from,1);
  if(pos>from)pos--;
  units.splice(pos,0,unit);
  s.board=padTeam(units);
  log(`\u8c03\u6574 ${unit.name} \u7684\u4f4d\u7f6e`,'good');
  return true;
}


function clearDropMarks(){
  document.querySelectorAll('.slot.drop-target,.slot.drop-blocked').forEach(el=>el.classList.remove('drop-target','drop-blocked'));
}

window.dragCard=(ev,where,i)=>{
  const unit=s[where]?.[i];
  if(!unit||unit.card_type!=='unit'||s.busy||s.phase!=='\u5907\u6218'||!['bench','shop','board'].includes(where)){
    ev.preventDefault();return false;
  }
  s.dragging={type:where,index:i};
  ev.dataTransfer.effectAllowed='move';
  ev.dataTransfer.setData('text/plain',JSON.stringify(s.dragging));
  ev.currentTarget.classList.add('dragging');
};

window.dragEnd=ev=>{
  ev.currentTarget.classList.remove('dragging');
  clearDropMarks();
  s.dragging=null;
};

function readDrag(ev){
  if(s.dragging)return s.dragging;
  try{return JSON.parse(ev.dataTransfer.getData('text/plain')||'null')}catch{return null}
}

window.allowBoardDrop=(ev,pos)=>{
  const d=readDrag(ev); if(!d)return;
  ev.preventDefault();ev.currentTarget.classList.remove('drop-target','drop-blocked');
  if((d.type==='bench'&&canDeployFromBench(d.index,pos))||(d.type==='board'&&canMoveBoard(d.index,pos))){ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add('drop-target')}
  else{ev.dataTransfer.dropEffect='none';ev.currentTarget.classList.add('drop-blocked')}
};

window.allowBenchDrop=(ev,i)=>{
  const d=readDrag(ev); if(!d)return;
  ev.preventDefault();ev.currentTarget.classList.remove('drop-target','drop-blocked');
  if(d.type==='shop'&&!s.bench[i]){ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add('drop-target')}
  else{ev.dataTransfer.dropEffect='none';ev.currentTarget.classList.add('drop-blocked')}
};

window.leaveDrop=ev=>{ev.currentTarget.classList.remove('drop-target','drop-blocked')};

window.dropToBoardInsert=(ev,pos)=>{
  const d=readDrag(ev); if(!d)return;
  ev.preventDefault();
  if(d.type==='bench')deployFromBenchInsert(d.index,pos)||log('\u53ea\u80fd\u5c06\u5907\u6218\u533a\u68cb\u5b50\u63d2\u5165\u5df1\u65b9\u68cb\u76d8\u3002','bad');
  else if(d.type==='board')moveBoardInsert(d.index,pos)||log('\u65e0\u6cd5\u79fb\u52a8\u8be5\u4e0a\u573a\u68cb\u5b50\u3002','bad');
  else log('\u53ea\u80fd\u5c06\u68cb\u5b50\u653e\u5230\u5df1\u65b9\u68cb\u76d8\u3002','bad');
  clearDropMarks();s.dragging=null;draw();
};

window.dropToBench=async(ev,i)=>{
  const d=readDrag(ev); if(!d)return;
  ev.preventDefault();
  if(d.type!=='shop'||s.bench[i]){log('\u53ea\u80fd\u628a\u5546\u5e97\u68cb\u5b50\u62d6\u5230\u7a7a\u5907\u6218\u683c\u8d2d\u4e70\u3002','bad');clearDropMarks();return draw()}
  const c=s.shop[d.index];
  if(!c)return;
  if(s.gold<c.cost){log('\u91d1\u5e01\u4e0d\u8db3','bad');clearDropMarks();return draw()}
  try{
    const r=await api('/api/buy',{card_id:c.id});
    syncPlayer(r);s.bench[i]={...c};s.shop[d.index]=null;log(`\u8d2d\u5165 ${c.name}`,'good');
  }catch(e){log(e.message,'bad')}
  clearDropMarks();s.dragging=null;draw();
};


function syncPlayer(r){
  s.gold=r.gold;
  if(r.health!==undefined)s.hp=r.health;
  if(r.round!==undefined)s.round=Math.max(1,Math.min(r.round,14));
  if(r.shop_level!==undefined)s.shopLevel=r.shop_level;
  if(r.upgrade_cost!==undefined)s.upgradeCost=r.upgrade_cost;
  if(r.next_income!==undefined)s.nextIncome=r.next_income;
  if(r.shop_slots!==undefined){s.shopSlots=r.shop_slots;while(s.shop.length<s.shopSlots)s.shop.push(null);if(s.shop.length>s.shopSlots)s.shop.length=s.shopSlots;}
}

window.choose=async(where,i)=>{
  if(s.busy)return;
  if(where==='shop'){
    const c=s.shop[i];
    if(!c)return;
    log(`\u62d6\u52a8 ${c.name} \u5230\u5907\u6218\u533a\u7a7a\u683c\u8d2d\u4e70\u3002`);
    return;
  }
  if(where==='bench'){
    const b=s.bench[i];
    if(!b)return;
    s.selected=s.selected===i?null:i;
    if(s.selected===null)log('\u53d6\u6d88\u9009\u62e9');
    else log(b.card_type==='unit'?`\u9009\u4e2d ${b.name}\uff1b\u53ef\u62d6\u5230\u68cb\u76d8\u4e2d\u63d2\u5165\u4e0a\u9635\uff0c\u6216\u70b9\u51fb\u201c\u51fa\u552e\u9009\u4e2d\u201d\u3002`:`\u9009\u4e2d ${b.name}`);
    return draw();
  }
  if(where==='board'){
    if(!s.board[i])return;
    const b=s.bench[s.selected];
    if(b?.card_type==='skill'){
      if(b.id==='rage')s.board[i].attack+=b.effect_value;
      if(b.id==='ward'||b.id==='vitality'){
        s.board[i].max_hp+=b.effect_value;
        s.board[i].current_hp=(s.board[i].current_hp||s.board[i].max_hp)+b.effect_value;
      }
      s.bench[s.selected]=null;
      s.selected=null;
      log(`\u6280\u80fd\u5df2\u4f5c\u7528\u4e8e ${s.board[i].name}`,'good');
      draw();
    }else log('\u4e0a\u573a\u68cb\u5b50\u53ef\u62d6\u52a8\u8c03\u6574\u4f4d\u7f6e\uff1b\u53f3\u952e\u53ef\u51fa\u552e\u3002');
  }
};

window.rightClickCard=(ev,where,i)=>{
  if(where!=='board')return;
  ev.preventDefault();
  if(s.busy||s.phase!=='\u5907\u6218')return;
  sellCard('board',i,true);
};

async function sellCard(where,index,half=false){
  const unit=where==='board'?s.board[index]:s.bench[index];
  if(!unit||unit.card_type!=='unit')return log('\u53ea\u80fd\u51fa\u552e\u68cb\u5b50','bad');
  try{
    const r=await api('/api/sell',{card_id:unit.id,half});
    syncPlayer(r);
    if(where==='board')s.board[index]=null;else s.bench[index]=null;
    s.selected=null;
    log(`${half?'\u534a\u4ef7':''}\u51fa\u552e ${unit.name}\uff0c\u83b7\u5f97 ${r.refund} \u91d1\u5e01\u3002`,'good');
    draw();
  }catch(e){log(e.message,'bad')}
}

async function refresh(){
  try{const r=await api('/api/refresh',{});syncPlayer(r);s.shop=r.shop;draw()}catch(e){log(e.message,'bad')}
}

async function upgradeShop(){
  try{const r=await api('/api/upgrade_shop',{});syncPlayer(r);log(`\u5546\u5e97\u5347\u7ea7\u5230 Lv.${s.shopLevel}\uff0c\u82b1\u8d39 ${r.spent} \u91d1\u5e01\u3002`,'good');draw()}catch(e){log(e.message,'bad')}
}

function startPrep(){
  clearInterval(s.timer);
  if(s.round>14||s.hp<=0){
    s.phase='\u5df2\u5b8c\u6210';
    log(s.hp<=0?'\u751f\u547d\u5f52\u96f6\uff0c\u6311\u6218\u5931\u8d25\u3002':'\u5df2\u5b8c\u6210\u7b2c 14/14 \u8f6e\uff0c\u5355\u4eba\u6a21\u5f0f\u7ed3\u675f\uff01',s.hp<=0?'bad':'good');
    return draw();
  }
  s.phase='\u5907\u6218';
  s.prepSeconds=PREP_TIMES[s.round-1];
  s.enemy=Array(7).fill(null);
  draw();
  log(`\u7b2c ${s.round}/14 \u8f6e\u5907\u6218\u5f00\u59cb\uff1a${s.prepSeconds} \u79d2\u540e\u81ea\u52a8\u6218\u6597\u3002`);
  api('/api/enemy',{round:s.round}).then(enemy=>{
    if(s.phase==='\u5907\u6218'){
      s.enemy=enemy;
      log(`\u7b2c ${s.round}/14 \u8f6e\u654c\u65b9\u9635\u5bb9\u5df2\u63ed\u793a\u3002`,'good');
      draw();
    }
  }).catch(e=>log(e.message,'bad'));
  s.timer=setInterval(()=>{
    s.prepSeconds--;
    draw();
    if(s.prepSeconds<=0){clearInterval(s.timer);fight()}
  },1000);
}


function updateCardHpElement(el,unit,hp){
  if(!el||!unit)return;
  const max=unit.max_hp||1;
  const info=el.querySelector('.info');
  if(info)info.textContent=`\u653b ${unit.attack}\u3000\u8840 ${Math.max(0,hp)}/${max}`;
  const bar=el.querySelector('.hp i');
  if(bar)bar.style.width=`${Math.max(0,hp/max*100)}%`;
  if(hp<=0)el.classList.add('dead');
}

async function animateAttackEvent(e){
  const fromWhere=e.side==='left'?'board':'enemy';
  const toWhere=e.target_side==='left'?'board':'enemy';
  const attacker=document.querySelector(`.card[data-side="${fromWhere}"][data-slot="${e.from_slot}"]`);
  const target=document.querySelector(`.card[data-side="${toWhere}"][data-slot="${e.to_slot}"]`);
  if(attacker){
    attacker.classList.add('active');
    await sleep(1000);
    attacker.classList.remove('active');
  }else await sleep(1000);
  if(attacker&&target){
    const a=attacker.getBoundingClientRect(),t=target.getBoundingClientRect();
    const dx=(t.left+t.width/2)-(a.left+a.width/2),dy=(t.top+t.height/2)-(a.top+a.height/2);
    attacker.classList.add('attacking');
    attacker.style.transform=`translate(${dx*.82}px,${dy*.82}px) scale(1.08)`;
    await sleep(240);
  }else await sleep(240);
  const arr=toWhere==='board'?s.board:s.enemy;
  const unit=arr[e.to_slot-1];
  if(unit){
    unit.current_hp=e.target_hp;
    updateCardHpElement(target,unit,e.target_hp);
  }
  log(`${e.side==='left'?'\u6211\u65b9':'\u5bf9\u624b'} ${e.from}[${e.from_slot}] \u2192 ${e.to}[${e.to_slot}]\uff0c\u9020\u6210 ${e.damage} \u4f24\u5bb3${e.target_dead?'\uff0c\u76ee\u6807\u5012\u4e0b':''}`);
  await sleep(1000);
  if(attacker){
    attacker.style.transform='translate(0,0) scale(1)';
    await sleep(240);
    attacker.classList.remove('attacking');
  }
  if(unit&&e.target_dead)arr[e.to_slot-1]=null;
  draw();
}


async function animateBattle(result){
  for(const e of result.events)await animateAttackEvent(e);
}

async function fight(){
  if(s.busy||s.phase!=='\u5907\u6218')return;
  clearInterval(s.timer);
  s.busy=true;
  s.phase='\u6218\u6597\u4e2d';
  s.board.forEach(u=>{if(u)u.current_hp=u.max_hp});
  const savedBoard=s.board.map(u=>u?{...u,current_hp:u.max_hp}:null);
  if(!s.enemy.some(Boolean))s.enemy=await api('/api/enemy',{round:s.round});
  s.enemy.forEach(u=>{if(u)u.current_hp=u.max_hp});
  draw();
  const battleRound=s.round;
  const result=await api('/api/battle',{left:s.board,right:s.enemy,round:battleRound});
  await animateBattle(result);
  s.board=result.left;
  s.enemy=result.right;
  syncPlayer(result);
  s.shop=await api('/api/shop');
  log('\u6218\u6597\u7ed3\u675f\uff0c\u5546\u5e97\u5df2\u81ea\u52a8\u5237\u65b0\u3002','good');
  draw();
  if(result.winner==='left')log(`\u7b2c ${battleRound}/14 \u8f6e\u80dc\u5229\uff0c\u80dc\u5229\u5956\u52b1 ${result.victory_bonus} \u91d1\u5e01\uff0c\u8fdb\u5165\u4e0b\u56de\u5408\u989d\u5916\u83b7\u5f97 ${result.income} \u91d1\u5e01\u3002`,'good');
  else log(`\u7b2c ${battleRound}/14 \u8f6e\u6218\u8d25\uff0cAI \u5269\u4f59\u661f\u7ea7 ${result.remaining_stars}\uff0c\u5931\u53bb ${result.loss_damage} \u751f\u547d\uff1b\u8fdb\u5165\u4e0b\u56de\u5408\u83b7\u5f97 ${result.income} \u91d1\u5e01\u3002`,'bad');
  await sleep(1000);
  s.board=savedBoard;
  s.busy=false;
  startPrep();
}

async function start(){
  const p=await api('/api/player');
  syncPlayer(p);
  s.shop=await api('/api/shop');
  log('\u7b2c 1 \u56de\u5408\u521d\u59cb 10 \u91d1\u5e01\uff1b\u672a\u7528\u5b8c\u7684\u91d1\u5e01\u4f1a\u7ee7\u627f\uff0c\u6bcf\u8f6e\u5f00\u59cb\u989d\u5916\u91d1\u5e01\u9012\u589e\uff1b\u80dc\u5229\u989d\u5916 +5 \u91d1\u5e01\u3002\u5931\u8d25\u6263\u8840\u7b49\u4e8e AI \u5b58\u6d3b\u68cb\u5b50\u7684\u661f\u7ea7\u603b\u548c\u3002');
  startPrep();
}

$('#refresh').onclick=refresh;
$('#upgrade').onclick=upgradeShop;
$('#fight').onclick=fight;
$('#skip').onclick=()=>{log('\u5df2\u8df3\u8fc7\u5907\u6218\uff0c\u76f4\u63a5\u5f00\u59cb\u6218\u6597\u3002');fight()};
$('#sell').onclick=()=>{if(s.selected!==null)sellCard('bench',s.selected)};
$('#reset').onclick=async()=>{try{await api('/api/reset',{});location.reload()}catch(e){log(e.message,'bad')}};
start().catch(e=>log('\u8bf7\u5148\u8fd0\u884c python server.py','bad'));
</script></body></html>
